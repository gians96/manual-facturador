# nginx config para servir el sitio estatico de Docusaurus (Facturador docs).
# El build de Docusaurus genera HTML por ruta (p.ej. /devs/api/introduccion/index.html),
# archivos .html sueltos y assets con hash bajo /assets/.

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # No exponer la version de nginx
    server_tokens off;

    # Redirects relativos: al servir un directorio, nginx agrega la barra final
    # con un 301. Con absolute_redirect off el Location es relativo (/ruta/),
    # asi respeta el esquema/host del proxy (Traefik/HTTPS en Dokploy) y no
    # degrada a http:// ni al puerto interno.
    absolute_redirect off;

    # Compresion
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/manifest+json
        image/svg+xml
        font/ttf
        font/woff
        font/woff2;

    # Assets con hash de contenido: cache agresivo e inmutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Imagenes y otros estaticos
    location ~* \.(?:ico|gif|jpe?g|png|webp|svg|woff2?|ttf|eot|mp4)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # HTML: no cachear el documento (los assets embebidos si llevan hash)
    location / {
        add_header Cache-Control "no-cache";
        # Docusaurus genera /ruta/index.html y/o /ruta.html
        try_files $uri $uri/ $uri.html =404;
    }

    # Pagina 404 generada por Docusaurus (se sirve con status 404)
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }
}
