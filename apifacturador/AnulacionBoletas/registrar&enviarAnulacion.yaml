openapi: 3.0.3
info:
  title: Introducción
  description: |-
    La API del **Facturador PRO 8** permite emitir comprobantes de pago electrónicos (CPE) y
    obtener por cada uno los 3 archivos indispensables: **XML Firmado, PDF y CDR**.

    Documentos contemplados:

    1. Factura
    2. Boleta
    3. Nota de Crédito
    4. Nota de Débito
    5. Resúmenes diarios (boletas)
    6. Anulaciones (comunicación de baja)
    7. Guía de remisión (remitente y transportista)
    8. Cotización
    9. Inventarios
    10. Productos

    **Autenticación:** todas las peticiones requieren el token de la cuenta enviado en el
    encabezado `Authorization: Bearer <TOKEN>` junto con `Accept: application/json`.
    El token se obtiene en el módulo **Configuración → Usuarios** del sistema (columna
    "Api Token") o mediante `POST /api/login` con el correo y contraseña del usuario.
  version: "8.0.0"
servers:
  - url: https://tu-dominio.com
    description: "Producción: reemplazar por el dominio de tu empresa"
  - url: https://empresa.pro8.uio.la
    description: Demostración
tags:
  - name: api
    description: Emisión de comprobantes electrónicos (CPE)

paths:
  /api/summaries:
    post:
      tags:
        - api
      summary: REGISTRAR Y ENVIAR ANULACIÓN
      description: |
        Las **boletas** (y sus notas) no se anulan con una comunicación de baja: se anulan mediante
        un **resumen** enviado a SUNAT con `codigo_tipo_proceso: "3"`. El resumen puede contener
        una o más boletas, todas **emitidas en la fecha indicada** en
        `fecha_de_emision_de_documentos`.

        El proceso es **asíncrono**: al registrar el resumen de anulación, SUNAT devuelve un
        **ticket** (`data.ticket`). Luego se debe consultar ese ticket con
        `POST /api/summaries/status` hasta obtener la aceptación; recién entonces las boletas
        quedan **Anuladas** (estado `11`).

        **Notas importantes:**
        - En este endpoint la fecha se envía en formato **`Y-m-d`** (año-mes-día), por ejemplo
          `"2026-07-22"`. Ojo: es distinto de `/api/voided`, que usa `d-m-Y`.
        - `external_id` es el identificador devuelto al emitir la boleta
          (`data.external_id` de `POST /api/documents`).
        - Las **facturas** y sus notas NO se anulan por este endpoint: usar `POST /api/voided`
          (comunicación de baja).

        ***Ejemplo:***
         - **Método:** POST
         - **URL:** `https://tu-dominio.com/api/summaries`
         - **Encabezados:** `Authorization: Bearer <TU_TOKEN>` y `Accept: application/json`
      operationId: registrar&enviarAnulacion
      requestBody:
        description: JSON a enviar
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnulacionBoletasRequest'
        required: true
      responses:
        '200':
          description: Resumen de anulación registrado y enviado; SUNAT devolvió un ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaAnulacion'
        '401':
          description: Token inválido o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNoAutenticado'
        '403':
          description: Bloqueo por licencia (tenant suspendido o emisión bloqueada)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorLicencia'
        '422':
          description: Error de validación de campos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
        '500':
          description: |
            Error de negocio. Mensajes típicos:
            - `No se enviaron documentos para la anulación.`
            - `El código externo {external_id} no fue encontrado o la fecha indica no corresponde al documento.`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
      security:
        - bearerAuth: []

components:
  schemas:
    AnulacionBoletasRequest:
      type: object
      properties:
        fecha_de_emision_de_documentos:
          type: string
          format: date
          description: |-
            Fecha de emisión de las boletas a anular, en formato **Y-m-d** (año-mes-día).
            Todas las boletas del array deben haber sido emitidas en esta fecha.
          example: "2026-07-22"
        codigo_tipo_proceso:
          type: string
          description: '"3" = anulación de boletas vía resumen. (Con "1" se registra un resumen diario, ver GENERAR RESÚMENES.)'
          example: "3"
        documentos:
          type: array
          description: Boletas que conforman el resumen de anulación. Requerido cuando `codigo_tipo_proceso` es "3".
          minItems: 1
          items:
            type: object
            required:
              - external_id
              - motivo_anulacion
            properties:
              external_id:
                type: string
                description: Identificador único de la boleta, devuelto al emitirla (`data.external_id`).
                example: "46c6ce9d-aaae-4b8d-8e94-a6f94c964b47"
              motivo_anulacion:
                type: string
                description: Motivo de la anulación que se informará a SUNAT.
                example: "Se duplicó documento"
      required:
        - fecha_de_emision_de_documentos
        - codigo_tipo_proceso
        - documentos

    RespuestaAnulacion:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            external_id:
              type: string
              description: Identificador único del resumen de anulación. Guardarlo para consultar el estado.
              example: "8cf16a43-9134-4809-8677-f0ecafede0b2"
            ticket:
              type: string
              description: Ticket asignado por SUNAT. Consultarlo después con `POST /api/summaries/status`.
              example: "1784778434733"
      required:
        - success
        - data

    ErrorNoAutenticado:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "No se encuentra autenticado"

    ErrorLicencia:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Emisión bloqueada por licencia."
        message_code:
          type: string
          description: '"LICENSE_TENANT_BLOCKED" (tenant suspendido) o "LICENSE_EMISSION_BLOCKED" (emisión bloqueada).'
          example: "LICENSE_EMISSION_BLOCKED"

    ErrorValidacion:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: object
          description: Objeto con los errores por campo.
          example:
            fecha_de_emision_de_documentos: ["El campo fecha de emision de documentos es obligatorio."]

    ErrorNegocio:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "No se enviaron documentos para la anulación."

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |-
        Token de la cuenta (columna "Api Token" en Configuración → Usuarios,
        o campo `token` de la respuesta de `POST /api/login`).
        Enviar en cada petición: `Authorization: Bearer <TOKEN>`.
