openapi: 3.0.3
info:
  title: Introducción
  description: |-
    La API del **Facturador** permite emitir comprobantes de pago electrónicos (CPE) y
    obtener por cada uno los 3 archivos indispensables: **XML Firmado, PDF y CDR**.

    Documentos contemplados:

    1. Factura
    2. Boleta
    3. Nota de Crédito
    4. Nota de Débito
    5. Resúmenes diarios (boletas)
    6. Anulaciones (comunicación de baja)
    7. Guía de remisión (remitente y transportista)
    8. Cotización
    9. Inventarios
    10. Productos

    **Autenticación:** todas las peticiones requieren el token de la cuenta enviado en el
    encabezado `Authorization: Bearer <TOKEN>` junto con `Accept: application/json`.
    El token se obtiene en el módulo **Configuración → Usuarios** del sistema (columna
    "Api Token") o mediante `POST /api/login` con el correo y contraseña del usuario.
  version: "8.0.0"
servers:
  - url: https://tu-dominio.com
    description: "Producción: reemplazar por el dominio de tu empresa"
  - url: https://tu-dominio.com
    description: Demostración
tags:
  - name: api
    description: Emisión de comprobantes electrónicos (CPE)

paths:
  /api/summaries/status:
    post:
      tags:
        - api
      summary: CONSULTAR TICKET ANULACIÓN
      description: |
        Consulta ante SUNAT el estado de un **resumen** registrado previamente con
        `POST /api/summaries` (en este caso, el resumen de anulación de boletas,
        `codigo_tipo_proceso: "3"`). Se puede identificar el resumen por su `external_id`
        **o** por su `ticket` (basta enviar uno de los dos). Son los **del resumen de
        anulación**, no los de la boleta.

        Cuando SUNAT acepta el resumen (`response.code: "0"`), las boletas que lo conforman
        pasan de `13` Por anular (o de `03`, si la empresa envía por un PSE o por el OSE
        SendFact) a `11` **Anulado**, y `links.cdr` descarga **el CDR de la
        anulación**: es el del resumen, no hay uno por boleta. SUNAT también lo describe como
        «Resumen diario … ha sido aceptado».

        Desde el 2026-09-22, `data.documents` trae las boletas del resumen con el estado en que
        quedaron tras la consulta (`11` si SUNAT aceptó), y `data.summary_status_type_id` vuelve
        como `"3"`.

        **Qué puede volver:**
        - `response.code: "0"` → anuladas.
        - HTTP 500 `Code: 98; Description: El procesamiento del comprobante aún no ha terminado`
          (envío directo a SUNAT), o HTTP 200 sin `response.code` (envío por PSE) → SUNAT aún
          procesa: repetir la consulta en unos minutos.
        - `response.code` distinto de `"0"` → SUNAT rechazó la anulación. Si la empresa envía
          directo a SUNAT (`status_code: 99`), las boletas vuelven a `01` Registrado —no a `05`—
          aunque para SUNAT sigan aceptadas: corregir y enviar la anulación otra vez antes de que
          un resumen diario las vuelva a declarar. Por un PSE no cambia ningún estado.

        **Ninguna tarea programada consulta estos resúmenes:** la de resúmenes solo mira los de
        tipo `"1"`, y «Consultar las comunicaciones de baja», solo las bajas de facturas. Lo
        consultas tú con esta llamada, o desde el panel en *Comprobantes pendientes →
        Anulaciones* (botón *Enviar Baja*). Si nadie lo hace, la boleta se queda en `13` (en `03`
        con PSE).

        El mismo endpoint consulta los resúmenes diarios: ver CONSULTAR RESUMEN en Generar
        Resúmenes. El ciclo completo, con ejemplos reales:
        [Ciclo de la boleta](/devs/api/offline/endpoints/ciclo-de-la-boleta).

        ***Ejemplo:***
         - **Método:** POST
         - **URL:** `https://tu-dominio.com/api/summaries/status`
         - **Encabezados:** `Authorization: Bearer <TU_TOKEN>`, `Accept: application/json` y `Content-Type: application/json`
      operationId: consultarTicketAnulacion
      requestBody:
        description: JSON a enviar (enviar `external_id` o `ticket`, al menos uno)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultaTicketRequest'
        required: true
      responses:
        '200':
          description: Estado del resumen de anulación. Las boletas quedan anuladas solo si `response.code` es `"0"`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaConsultaTicket'
        '401':
          description: Token inválido o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNoAutenticado'
        '403':
          description: Tenant suspendido por licencia (`LICENSE_TENANT_BLOCKED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorLicencia'
        '500':
          description: |
            Solo el primero se reintenta:
            - `Code: 98; Description: El procesamiento del comprobante aún no ha terminado`
              (SUNAT aún procesa: consultar otra vez en unos minutos)
            - `Es requerido el código externo o ticket` (no se envió ninguno de los dos)
            - `El código externo {external_id} es inválido, no se encontró resumen relacionado`
              (casi siempre: se envió el `external_id` de la boleta en vez del del resumen)
            - `El ticket {ticket} es inválido, no se encontró resumen relacionado`
            - `Code: 0127; Description: El ticket no existe` (SUNAT ya no reconoce el ticket; en
              beta pasó al reconsultar un resumen que ya había respondido)
            - `Undefined variable $cdrResponse` (OSE SendFact mientras aún no hay CDR: tratarlo
              como el 98)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
      security:
        - bearerAuth: []

components:
  schemas:
    ConsultaTicketRequest:
      type: object
      description: Enviar `external_id` o `ticket` (al menos uno de los dos).
      properties:
        external_id:
          type: string
          description: Identificador del resumen (`data.external_id` de `POST /api/summaries`). Alternativa a `ticket`.
          example: "8cf16a43-9134-4809-8677-f0ecafede0b2"
        ticket:
          type: string
          description: Ticket SUNAT devuelto al registrar el resumen (`data.ticket`). Alternativa a `external_id`.
          example: "1784778434733"

    RespuestaConsultaTicket:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            external_id:
              type: string
              example: "8cf16a43-9134-4809-8677-f0ecafede0b2"
            ticket:
              type: string
              nullable: true
              description: Ticket SUNAT del resumen. Desde el 2026-09-22.
              example: "1784778434733"
            filename:
              type: string
              description: Nombre del archivo del resumen (RUC-RC-fecha-correlativo).
              example: "20123456789-RC-20260722-2"
            date_of_reference:
              type: string
              format: date
              description: Fecha de emisión de las boletas anuladas. Desde el 2026-09-22.
              example: "2026-07-22"
            summary_status_type_id:
              type: string
              description: '"3": anulación. Desde el 2026-09-22.'
              example: "3"
            state_type_id:
              type: string
              description: Estado del resumen tras la consulta. `05` aceptado. Desde el 2026-09-22.
              example: "05"
            state_type_description:
              type: string
              example: "Aceptado"
            documents:
              type: array
              description: |-
                Las boletas de este resumen, con el estado en que quedaron después de la consulta:
                `11` si SUNAT aceptó la anulación. Desde el 2026-09-22.
              items:
                $ref: '#/components/schemas/ComprobanteDelResumen'
        links:
          type: object
          properties:
            xml:
              type: string
              description: URL de descarga del XML firmado del resumen.
              example: "https://tu-dominio.com/downloads/summary/xml/8cf16a43-9134-4809-8677-f0ecafede0b2"
            cdr:
              type: string
              description: URL de descarga del CDR **del resumen de anulación**, que es el de todas sus boletas. No pide token.
              example: "https://tu-dominio.com/downloads/summary/cdr/8cf16a43-9134-4809-8677-f0ecafede0b2"
        response:
          type: object
          description: Respuesta de SUNAT.
          properties:
            sent:
              type: boolean
              example: true
            code:
              type: string
              description: '"0" indica aceptación. No llega mientras un PSE aún no devuelve el CDR.'
              example: "0"
            description:
              type: string
              example: "El Resumen diario RC-20260722-2, ha sido aceptado"
            notes:
              type: array
              items:
                type: string
              example: []
            is_accepted:
              type: boolean
              example: true
            status_code:
              type: integer
              description: Si la empresa envía directo a SUNAT, 0 aceptado y 99 rechazado. Por un PSE repite el código del CDR (igual que `code`), e `is_accepted` llega siempre `true`; decide solo con `code`.
              example: 0
      required:
        - success
        - data

    ComprobanteDelResumen:
      type: object
      properties:
        id:
          type: integer
          description: Id del comprobante, el mismo de la fila de `sync-batch`.
          example: 123
        external_id:
          type: string
          description: El `external_id` de la boleta.
          example: "c50fb61c-ed0c-4bc6-b70a-df7893a7eba8"
        offline_id:
          type: string
          nullable: true
          description: El que el integrador mandó a `sync-batch`, tal cual. `null` si la boleta no entró por `sync-batch`.
          example: "B2C3D4E5-F6A7-8901-BCDE-F12345678901"
        document_type_id:
          type: string
          description: '"03" boleta; "07" y "08", notas de crédito y débito de boleta.'
          example: "03"
        series:
          type: string
          example: "B001"
        number:
          type: integer
          description: El correlativo, sin la serie.
          example: 1
        number_full:
          type: string
          description: Serie y correlativo; lo que la fila de `sync-batch` llama `number`.
          example: "B001-1"
        currency_type_id:
          type: string
          example: "PEN"
        total:
          type: string
          description: Total de la boleta, como texto con dos decimales.
          example: "118.00"
        state_type_id:
          type: string
          description: Estado de la boleta después de la consulta.
          example: "11"
        state_type_description:
          type: string
          example: "Anulado"

    ErrorNoAutenticado:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "No se encuentra autenticado"

    ErrorLicencia:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Operación bloqueada: tenant suspendido por licencia."
        message_code:
          type: string
          example: "LICENSE_TENANT_BLOCKED"

    ErrorNegocio:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Es requerido el código externo o ticket"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |-
        Token de la cuenta (columna "Api Token" en Configuración → Usuarios,
        o campo `token` de la respuesta de `POST /api/login`).
        Enviar en cada petición: `Authorization: Bearer <TOKEN>`.
