                  indicador_de_transbordo: false
                  indicador_vehiculos_conductores_transportista: true
                  unidad_peso_total: "TNE"
                  peso_total: 30.35
                  numero_de_bultos: 297
                  observaciones: "RETORNO A NUESTRO ALMACEN POR PESAJE EN BALANZA"
                  direccion_partida:
                    ubigeo: "040104"
                    direccion: "Av. Balanza Demo Km 4.5 - Cerro Colorado"
                    codigo_del_domicilio_fiscal: "0000"
                  direccion_llegada:
                    ubigeo: "040104"
                    direccion: "Cal. Almacén Demo 13 - Cerro Colorado"
                    codigo_del_domicilio_fiscal: "0000"
                  transportista:
                    codigo_tipo_documento_identidad: "6"
                    numero_documento: "20000000002"
                    apellidos_y_nombres_o_razon_social: "TRANSPORTES DEMO S.R.L."
                    numero_mtc: "1500001CNG"
                    numero_autorizacion_especial: "1500002MRP"
                    codigo_entidad_autorizadora: "06"
                  chofer:
                    codigo_tipo_documento_identidad: "1"
                    numero_documento: "12345678"
                    nombres: "PEREZ GARCIA, JUAN"
                    numero_licencia: "Q12345678"
                  vehiculo:
                    numero_de_placa: "TRC123"
                    certificado_habilitacion_vehicular: "15MRP00000001E"
                  vehiculo_secundario:
                    - numero_de_placa: "REM456"
                      certificado_habilitacion_vehicular: "15MRP00000002E"
                  documento_relacionado:
                    - numero: "1500002MRP"
                      empresa: "TRANSPORTES DEMO S.R.L."
                      ruc: "20000000002"
                      documento:
                        id: "76"
                        descripcion: "Autorización para manejo y recojo de residuos sólidos peligrosos y no peligrosos"
                  items:
                    - codigo_interno: "M0001"
                      descripcion: "MINERAL MOLIDO"
                      unidad_de_medida: "TNE"
                      cantidad: 30.35
        required: true
      responses:
        '200':
          description: Guía generada correctamente (XML firmado y PDF; aún sin enviar a SUNAT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaGuia'
        '401':
          description: Token inválido o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNoAutenticado'
        '403':
          description: Bloqueo por licencia (tenant suspendido o emisión bloqueada)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorLicencia'
        '422':
          description: |-
            Entrada rechazada por ser atribuible al integrador. Dos orígenes distintos:
            - Validación de campos: falta `direccion` en `direccion_partida` o `direccion_llegada`.
            - `MISSING_FIELDS` con `indicador_vehiculos_conductores_transportista` verdadero y sin
              el conductor completo (`chofer.codigo_tipo_documento_identidad`,
              `chofer.numero_documento`, `chofer.nombres`, `chofer.numero_licencia`) o sin
              `vehiculo.numero_de_placa`. SUNAT rechaza esa guía (3357 y 2566), así que no se
              emite. `errors.faltantes` lista todo lo que falta de una vez. Un `"FALSE"` de texto
              no activa esta exigencia.
            - Referencias que no existen: `"La serie ingresada T001, es incorrecta."`,
              `"El código ingresado del establecimiento es incorrecto."`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
        '500':
          description: |-
            Fallo real del servidor. Ya no incluye los bloques a medias: desde el
            2026-09-09 una sub-clave ausente se rechaza antes de emitir con un 422
            `MISSING_FIELDS` que nombra el campo, en vez del
            `"Undefined array key ..."` que salía como 500.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
      security:
        - bearerAuth: []

components:
  schemas:
    GuiaRemitentePublicoRequest:
      type: object
      required:
        - serie_documento
        - numero_documento
        - fecha_de_emision
        - hora_de_emision
        - codigo_tipo_documento
        - datos_del_cliente_o_receptor
        - codigo_motivo_traslado
        - codigo_modo_transporte
        - fecha_de_traslado
        - indicador_de_transbordo
        - unidad_peso_total
        - peso_total
        - direccion_partida
        - direccion_llegada
        - transportista
        - items
      properties:
        serie_documento:
          type: string
          description: Serie de guía de remisión remitente (tipo 09). Debe existir en el sistema.
          example: "T001"
        numero_documento:
          type: string
          description: Correlativo. Usar "#" para que el sistema lo asigne automáticamente (recomendado).
          example: "#"
        fecha_de_emision:
          type: string
          format: date
          example: "2026-07-22"
        hora_de_emision:
          type: string
          example: "10:11:11"
        codigo_tipo_documento:
          type: string
          description: '"09" Guía de Remisión Remitente, "31" Guía de Remisión Transportista.'
          example: "09"
        datos_del_emisor:
          description: |-
            Opcional desde el 2026-09-09. Si no se envía, se usa el establecimiento
            del usuario del token, igual que en `POST /api/documents`. Si se envía
            con un código que no existe, sigue siendo un 422 `INVALID_ESTABLISHMENT`.
          allOf:
            - $ref: '#/components/schemas/DatosDelEmisor'
        datos_del_cliente_o_receptor:
          type: object
          description: >-
            Destinatario de los bienes. Igual estructura que en facturas; si el cliente no existe
            se crea automáticamente. Puede ser **tu propia empresa**: SUNAT lo exige en los
            motivos "02", "04", "07" y "18" (2554), lo prohíbe en "01", "03", "05", "06", "09",
            "14" y "17" (2555) y lo admite en el resto, como un "13" de retorno a tu almacén.
            Sin `direccion`, el PDF no imprime la línea de dirección.
          required:
            - codigo_tipo_documento_identidad
            - numero_documento
            - apellidos_y_nombres_o_razon_social
          properties:
            codigo_tipo_documento_identidad:
              type: string
              description: Catálogo 06 SUNAT. "1" DNI, "6" RUC, "4" Carnet de extranjería, "7" Pasaporte.
              example: "6"
            numero_documento:
              type: string
              example: "20123456789"
            apellidos_y_nombres_o_razon_social:
              type: string
              example: "EMPRESA XYZ S.A."
            nombre_comercial:
              type: string
              example: "EMPRESA XYZ"
            codigo_pais:
              type: string
              example: "PE"
            ubigeo:
              type: string
              example: "150101"
            direccion:
              type: string
              example: "Av. 2 de Mayo 123 - Lima"
            correo_electronico:
              type: string
              example: "cliente@correo.com"
            telefono:
              type: string
              example: "999888777"
        codigo_motivo_traslado:
          type: string
          description: >-
            Catálogo 20 SUNAT, según la RS 000240-2024. Catorce códigos: "01" Venta,
            "02" Compra, "03" Venta con entrega a terceros, "04" Traslado entre
            establecimientos de la misma empresa, "05" Consignación, "06" Devolución,
            "07" Recojo de bienes transformados, "08" Importación, "09" Exportación,
            "13" Otros (requiere `descripcion_motivo_traslado`), "14" Venta sujeta a
            confirmación del comprador, "17" Traslado de bienes para transformación,
            "18" Traslado por emisor itinerante de comprobantes de pago, "19" Traslado
            de mercancía extranjera.
          example: "01"
        descripcion_motivo_traslado:
          type: string
          description: >-
            Obligatoria cuando `codigo_motivo_traslado` es "13" Otros; opcional en el resto.
            Desde el 2026-09-16 **viaja a SUNAT** en `cbc:HandlingInstructions` con cualquier
            motivo (antes se enviaba siempre el texto del catálogo y esta descripción solo salía
            en el PDF). Se envía sin saltos de línea ni tabuladores y cortada a 100 caracteres:
            si se corta, la respuesta avisa `RECORTE_DESCRIPCION_MOTIVO`. En el "13" SUNAT observa
            (4190) una descripción con menos de 3 letras, y también avisa. Sin descripción viaja
            el texto del catálogo. Escribe el motivo real («RETORNO A NUESTRO ALMACEN POR PESAJE
            EN BALANZA»), no un texto genérico.
          example: "Traslado por venta"
        codigo_modo_transporte:
          type: string
          description: '"01" transporte público (requiere `transportista`), "02" transporte privado (requiere `chofer` y `vehiculo`).'
          example: "01"
        fecha_de_traslado:
          type: string
          format: date
          example: "2026-07-22"
        indicador_de_transbordo:
          type: boolean
          description: '**Obligatorio**: si se omite, la inserción en base de datos falla.'
          example: false
        unidad_peso_total:
          type: string
          enum: ["KGM", "TNE"]
          description: >-
            Unidad del peso bruto total. SUNAT admite **solo** "KGM" (kilogramos) y
            "TNE" (toneladas); cualquier otra se rechaza con 2523. El panel lo limita
            en el desplegable, pero este campo acepta lo que le mandes y lo vuelca al
            XML, así que revísalo. Sale además como aviso previo.
          example: "KGM"
        peso_total:
          type: number
          minimum: 0.001
          description: >-
            Peso bruto total de la carga. SUNAT exige un decimal **positivo** de hasta
            12 enteros y 3 decimales: cero se rechaza con 2523, y sale como aviso previo.
            El sistema lo guarda con **2 decimales**: el tercero se redondea (34.825 se
            registra y viaja como 34.83) y la respuesta lo avisa con `REDONDEO_PESO`.
          example: 30
        numero_de_bultos:
          type: number
          description: >-
            Opcional. **Excluyente con `numero_de_contenedor`** en los motivos "08",
            "09" y "19" con documento relacionado de aduanas: declarar los dos es
            rechazo 3621. En cambio en exportación con DAM o DS y sin contenedor es
            obligatorio (3419), y con motivo "19" y cita del terminal ("92") no se
            puede consignar (3626).
          example: 1
        numero_de_contenedor:
          type: integer
          nullable: true
          description: >-
            Opcional (solo importación/exportación). La columna es numérica: un
            código ISO 6346 alfanumérico como "MSKU1234567" se rechaza con
            INVALID_NUMERIC_VALUE. Si no aplica, envía null — nunca cadena vacía.
          example: null
        codigo_de_puerto:
          type: string
          nullable: true
          description: >-
            Código del puerto (Catálogo N.° 63) o del aeropuerto (Catálogo N.° 64).
            **Obligatorio con `codigo_motivo_traslado` "19"**: sin él SUNAT rechaza
            con 3483. Opcional en "08" y "09". Debe ir acompañado de
            `tipo_de_puerto`: si envías uno sin el otro, la guía sale sin el dato y
            SUNAT observa (4413, 4415). El ubigeo del puerto tiene que coincidir con
            el de `direccion_partida`, o SUNAT rechaza con 3364.
          example: "CLL"
        tipo_de_puerto:
          type: string
          nullable: true
          enum: ["1", "2"]
          description: >-
            "1" puerto, "2" aeropuerto. Hace falta porque el mismo código puede ser
            las dos cosas: "IQT" es el puerto de Iquitos y también el aeropuerto
            Coronel FAP Francisco Secada Vignetta.
          example: "1"
        fecha_entrega_transporte:
          type: string
          format: date
          description: >-
            Opcional. Fecha en que el remitente entrega los bienes al transportista. Si no
            la envías, en su lugar viaja `fecha_de_traslado`. No puede ser anterior a
            `fecha_de_emision` (3618) y, con `indicador_vehiculos_conductores_transportista`,
            `fecha_de_traslado` no puede ser anterior a esta fecha (3616). SUNAT rechaza los
            dos casos, pero aquí salen **como aviso**: la guía se genera y se firma igual, así
            que corrígela antes de enviarla.
          example: "2026-07-22"
        indicador_vehiculos_conductores_transportista:
          type: boolean
          description: >-
            Opcional, desde el 2026-09-14. `true` cuando el remitente declara el vehículo y el
            conductor de la empresa de transporte (`SUNAT_Envio_IndicadorVehiculoConductoresTransp`).
            Solo aplica con `codigo_modo_transporte` "01". Acepta también texto (`"true"` /
            `"false"`); ausente cuenta como `false` y `chofer` y `vehiculo` se descartan.
            Con `true` exige `chofer` completo y `vehiculo.numero_de_placa`, o responde 422
            `MISSING_FIELDS`.
          example: false
        direccion_partida:
          $ref: '#/components/schemas/DireccionTraslado'
        direccion_llegada:
          $ref: '#/components/schemas/DireccionTraslado'
        transportista:
          type: object
          description: >-
            Empresa de transporte contratada (solo modo "01"). Son obligatorias las 3 claves de
            identidad. `numero_mtc` es opcional desde el 2026-09-09: sin él SUNAT observa 4391.
            Si el transportista ya existe en el sistema, se completan **solo** los datos que
            tenga vacíos (registro MTC y autorización especial).
          required:
            - codigo_tipo_documento_identidad
            - numero_documento
            - apellidos_y_nombres_o_razon_social
          properties:
            codigo_tipo_documento_identidad:
              type: string
              description: '"6" RUC.'
              example: "6"
            numero_documento:
              type: string
              description: RUC de la empresa de transporte.
              example: "20123456789"
            apellidos_y_nombres_o_razon_social:
              type: string
              example: "TRANSPORTES ABC S.A.C."
            numero_mtc:
              type: string
              description: Opcional. Número de registro MTC.
              example: ""
            numero_autorizacion_especial:
              type: string
              description: >-
                Opcional. Número de la autorización especial del transportista (por ejemplo,
                para residuos sólidos o materiales peligrosos). Va con
                `codigo_entidad_autorizadora`: sin ella no se emite (aviso 4394). De 3 a 50
                caracteres; admite espacios, guiones y barras, pero no tabulaciones ni saltos de
                línea: si no, SUNAT la observa y la respuesta avisa 4396. A diferencia de la de
                un vehículo, viaja con o sin el indicador.
              example: "1500002MRP"
            codigo_entidad_autorizadora:
              $ref: '#/components/schemas/EntidadAutorizadora'
        chofer:
          description: >-
            Solo con `indicador_vehiculos_conductores_transportista` en `true`, y entonces
            obligatorio con sus 4 claves. Sin el indicador se descarta.
          allOf:
            - $ref: '#/components/schemas/Chofer'
        chofer_secundario:
          type: array
          maxItems: 2
          description: >-
            Opcional, solo con el indicador. Conductores secundarios (máximo 2). **No se
            validan**: cada uno debe traer `codigo_tipo_documento_identidad`,
            `numero_documento`, `nombres` y `numero_licencia`. Uno a medias se emite con datos
            vacíos y avisa `SECUNDARIO_INCOMPLETO`; sin tipo de documento, SUNAT lo rechaza con
            2570, que también sale como aviso.
          items:
            $ref: '#/components/schemas/Chofer'
        vehiculo:
          description: >-
            Solo con `indicador_vehiculos_conductores_transportista` en `true`, y entonces
            `numero_de_placa` es obligatoria. Sin el indicador se descarta.
          allOf:
            - $ref: '#/components/schemas/Vehiculo'
        vehiculo_secundario:
          type: array
          maxItems: 2
          description: >-
            Opcional, solo con el indicador. Vehículos secundarios (máximo 2; desde el tercero se
            descartan y SUNAT observa 4389 con más de dos). Aquí va el **remolque o
            semirremolque** de un tracto: el tracto en `vehiculo` y el remolque en
            `vehiculo_secundario[0]`, cada uno con su placa y su propio
            `certificado_habilitacion_vehicular`. En el XML sale como
            `cac:AttachedTransportEquipment`; no hay otra clave para el semirremolque. **No se
            validan**: uno con TUC o autorización especial pero sin `numero_de_placa` se emite
            con la placa vacía y avisa `SECUNDARIO_INCOMPLETO`.
          items:
            $ref: '#/components/schemas/Vehiculo'
        items:
          type: array
          minItems: 1
          description: Bienes a trasladar.
          items:
            $ref: '#/components/schemas/ItemGuia'
        observaciones:
          type: string
          description: >-
            Opcional. Viajan a SUNAT en el XML (`cbc:Note`); con más de 250 caracteres SUNAT
            observa 4186. **El PDF A4 no las imprime por defecto** desde el 2026-09-14: para
            que salgan, enciende el bloque *Observaciones* en la plantilla de la guía
            ([Plantillas PDF - Guías de remisión](/modulos/configuracion-y-mas/configuracion-globales/Plantillas/Plantillas-pdf-guias)).
          example: ""
        comprobante_de_referencia:
          $ref: '#/components/schemas/ComprobanteDeReferencia'
        documento_afectado:
          $ref: '#/components/schemas/DocumentoAfectado'
        documento_relacionado:
          type: array
          description: >-
            Otros documentos relacionados al traslado (Catálogo N.° 61).
            **Obligatorio en los motivos aduaneros**, donde SUNAT rechaza si falta:
            "08" y "09" exigen una DAM ("50") o una DS ("52") o devuelven 3440, y
            "19" exige "50", "52", "91" (manifiesto de carga) o "92" (cita del
            terminal portuario) o devuelve 3493.
            El número de la DAM y de la DS es `aduana(3)-año(4)-régimen(2)-correlativo(1..6)`
            y **el régimen depende del motivo**, o SUNAT rechaza con 3441:
            "10" en importación, "40" en exportación (DS: "18" y "48"). En el motivo
            "19" la DAM admite "10", "20", "21", "30", "36", "70" y "80".


            **Quién emitió el documento** (`IssuerParty` en el XML, desde el 2026-09-14): con
            los códigos "01", "03", "04", "09", "12" y "48" es siempre la empresa que emite la
            guía (regla 3381). Con cualquier otro código, por ejemplo "76" (autorización de
            residuos sólidos del transportista), se usa el `ruc` de la fila si tiene 11 dígitos;
            si no, la empresa.
          items:
            $ref: '#/components/schemas/DocumentoRelacionado'
        leyendas:
          type: array
          description: Opcional.
          items:
            $ref: '#/components/schemas/Leyenda'
        acciones:
          $ref: '#/components/schemas/Acciones'

    DatosDelEmisor:
      type: object
      description: >-
        Datos del establecimiento emisor. `codigo_del_domicilio_fiscal` es obligatorio
        ("0000" = domicilio fiscal principal); con un código inexistente responde 422
        "El código ingresado del establecimiento es incorrecto."
      required:
        - codigo_del_domicilio_fiscal
      properties:
        codigo_del_domicilio_fiscal:
          type: string
          example: "0000"

    DireccionTraslado:
      type: object
      description: >-
        Punto de partida / llegada del traslado. Las 3 claves son obligatorias (el backend
        las accede directamente). En `codigo_del_domicilio_fiscal` usar "0000" si el punto
        no corresponde a un establecimiento anexo declarado en SUNAT.
      required:
        - ubigeo
        - direccion
        - codigo_del_domicilio_fiscal
      properties:
        ubigeo:
          type: string
          pattern: '^[0-9]{6}$'
          description: >-
            Código de ubigeo INEI de **6 dígitos exactos**. Uno más corto se rechaza, y
            desde ahora sale como aviso previo 2775.
            Nota para integraciones anteriores al 11/09/2026: el ubigeo de
            `direccion_partida` se truncaba a un solo carácter en 285 de los 1876
            distritos, los de provincias numeradas de la 10 en adelante. Huari (021001)
            se emitía como "1". Ya está corregido.
          example: "150101"
        direccion:
          type: string
          maxLength: 100
          description: Dirección del punto (máximo 100 caracteres).
          example: "Av. 2 de Mayo 123 - Lima"
        codigo_del_domicilio_fiscal:
          type: string
          description: >-
            Código de establecimiento anexo declarado en SUNAT; "0000" (domicilio fiscal) si no
            aplica. Ausente, `null` o vacío cuenta como "0000". **Llegada:** viaja asociado al
            RUC del destinatario (solo si el destinatario tiene RUC y el motivo no es "18"); un
            código distinto de "0000" tiene que estar declarado para ese RUC con el mismo ubigeo.
            **Partida:** hoy el XML emite siempre "0000" con el RUC de tu empresa, aunque envíes
            otro código.
          example: "0000"

    EntidadAutorizadora:
      type: string
      enum: ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12", "13"]
      description: >-
        Opcional, desde el 2026-09-14. Entidad que otorgó la autorización especial, catálogo
        D-37 de SUNAT: "01" SUCAMEC, "02" DIGEMID, "03" DIGESA, "04" SENASA, "05" SERFOR,
        "06" MTC, "07" PRODUCE, "08" Ministerio del Ambiente, "09" SANIPES, "10" Municipalidad
        Metropolitana de Lima, "11" MINSA, "12" Gobierno Regional, "13" OSINERGMIN. "6" se
        acepta como "06". No hay entidad por defecto: sin número y entidad válida la
        autorización no se emite y se avisa en `warnings` (4394/4397 y 4395 en el
        transportista; 4403/4405 y 4407 en un vehículo). Un número con formato inválido
        viaja igual y avisa 4396 (transportista) o 4406 (vehículo). Ojo: "76" es un código de documento
        relacionado (catálogo 61), no una entidad. El "06" (MTC) de los ejemplos es solo un
        ejemplo: envía el código de la entidad que otorgó cada autorización.
      example: "06"

    Chofer:
      type: object
      description: Datos del conductor.
      required:
        - codigo_tipo_documento_identidad
        - numero_documento
        - nombres
        - numero_licencia
      properties:
        codigo_tipo_documento_identidad:
          type: string
          description: Catálogo 06 SUNAT. "1" DNI, "4" Carnet de extranjería.
          example: "1"
        numero_documento:
          type: string
          example: "12345678"
        nombres:
          type: string
          description: >-
            Apellidos y nombres del conductor en un solo campo, con la forma
            "APELLIDOS, NOMBRES". La coma es la que separa en el XML los apellidos
            (`FamilyName`) de los nombres (`FirstName`); sin coma, el nombre completo
            va en los dos.
          example: "PEREZ GARCIA, JUAN"
        numero_licencia:
          type: string
          example: "Q12345678"
        telefono:
          type: string
          description: Opcional.
          example: "999888777"

    Vehiculo:
      type: object
      description: Datos del vehículo.
      required:
        - numero_de_placa
      properties:
        numero_de_placa:
          type: string
          description: Sin guiones ni espacios, o SUNAT rechaza con 2567.
          example: "ABC123"
        modelo:
          type: string
          description: Opcional.
          example: "FH 540"
        marca:
          type: string
          description: Opcional.
          example: "VOLVO"
        certificado_habilitacion_vehicular:
          type: string
          description: >-
            Opcional. Número de la **Constancia de Inscripción Vehicular, Certificado de
            Habilitación Vehicular o TUC** (física o electrónica) que el MTC otorgó a **este**
            vehículo: en algunos sistemas se llama «Constancia Insc. MTC» o «TUCE». El tracto y
            el remolque tienen cada uno la suya. SUNAT exige de 10 a 15 caracteres, solo letras
            mayúsculas y números (sin espacios ni guiones), o rechaza con 3355. Viaja al XML con
            el indicador de vehículos y conductores del transportista; con el indicador y sin
            este dato SUNAT observa 4399 y la guía se emite igual, con aviso.
          example: "15MRP00000001E"
        numero_autorizacion_especial:
          type: string
          description: >-
            Opcional, desde el 2026-09-14. Autorización especial del vehículo. Viaja al XML
            solo con el indicador y con `codigo_entidad_autorizadora`. Completa y válida pero
            sin el indicador, se guarda, no viaja y la respuesta avisa
            `AUTORIZACION_NO_EMITIDA` (aviso del sistema). De 3 a 50 caracteres; admite
            espacios, guiones y barras, pero no tabulaciones ni saltos de línea: si no, SUNAT
            la observa y la respuesta avisa 4406.
          example: "1500003CNG"
        codigo_entidad_autorizadora:
          $ref: '#/components/schemas/EntidadAutorizadora'

    ItemGuia:
      type: object
      required:
        - codigo_interno
        - descripcion
        - unidad_de_medida
        - cantidad
      properties:
        codigo_interno:
          type: string
          description: >-
            Código del producto. Si no existe, el producto se crea automáticamente
            (en ese caso enviar también `valor_unitario` y `codigo_tipo_afectacion_igv`).
          example: "P0121"
        descripcion:
          type: string
          example: "Inca Kola 250 ml"
        nombre:
          type: string
          description: Opcional. Nombre del producto (usado al crear el producto nuevo).
          example: "Inca Kola 250 ml"
        unidad_de_medida:
          type: string
          description: >-
            Catálogo de unidades SUNAT ("NIU" unidad, "KGM" kilogramo, "TNE" tonelada, etc.).
            Si la envías, es la unidad que viaja en el XML para esa línea **aunque el producto
            ya exista** con otra; si la omites, se usa la del producto. En el motivo "09"
            (exportación) la línea viaja siempre con "U".
          example: "NIU"
        cantidad:
          type: number
          description: >-
            Se guarda con 4 decimales: si envías más, se redondea y la respuesta avisa
            `REDONDEO_CANTIDAD`.
          example: 2
        valor_unitario:
          type: number
          description: |-
            Opcional. Una guía de remisión no lleva importes: `dispatch_items` no tiene
            columna de precio y el XML solo emite cantidad, descripción y código. Solo se
            usa al dar de alta un producto que aún no existe, y desde el 2026-09-09
            tampoco hace falta entonces: el producto nace con precio 0, visible en el
            panel para corregirlo. Se acepta igualmente en `precio_unitario`.
          example: 50
        codigo_tipo_afectacion_igv:
          type: string
          description: Catálogo 07 SUNAT ("10" gravado, "20" exonerado, "30" inafecto). Necesario solo si el producto se crea nuevo.
          example: "10"

    ComprobanteDeReferencia:
      type: object
      description: >-
        Opcional. Comprobante (factura o boleta) que origina el traslado, **enlazado de
        verdad**: escribe la clave foránea, de modo que la guía deja de figurar como
        pendiente de facturar, el listado muestra su N.º de comprobante y el PDF lo imprime.
        Si no envías `documento_relacionado`, además lo deriva de aquí para que el
        `cac:AdditionalDocumentReference` salga en el XML.


        Disponible desde el 2026-09-08. **Efecto sobre el stock:** con esta clave la guía
        **no** descuenta existencias, porque ya las descontó el comprobante. Ver
        [Documentos relacionados](/devs/api/documentos-relacionados).


        Tres formas de nombrarlo, elige una: `external_id`; la terna
        `serie_documento` + `numero_documento` (+ `codigo_tipo_documento` para desambiguar);
        o `codigo`, el id interno.
      properties:
        external_id:
          type: string
          description: external_id que devolvió la API al emitir el comprobante. La forma recomendada.
          example: "46c6ce9d-aaae-4b8d-8e94-a6f94c964b47"
        serie_documento:
          type: string
          example: "F001"
        numero_documento:
          type: string
          description: >-
            Correlativo. Admite ceros a la izquierda y también la forma combinada "F001-190".
          example: "190"
        codigo_tipo_documento:
          type: string
          description: Opcional; solo hace falta si la serie-número pudiera existir en dos tipos.
          example: "01"
        codigo:
          type: integer
          description: Id interno del comprobante. Último recurso.
          example: 1234

    DocumentoAfectado:
      type: object
      description: >-
        Opcional. Comprobante que sustenta el traslado, **solo a efectos de impresión**: se
        guarda en la guía y se imprime en su PDF, pero **no viaja en el XML** que recibe
        SUNAT **ni relaciona los dos registros** en base de datos — la guía seguirá
        figurando como pendiente de facturar. Corregido el 2026-09-08: la redacción
        anterior («de un comprobante ya emitido en el sistema») hacía pensar en un enlace
        que nunca ocurría. Para que SUNAT vea el comprobante, usa `documento_relacionado`.
      properties:
        external_id:
          type: string
          description: >-
            **Hoy se ignora**: el sistema lo recibe y lo descarta sin avisar, de modo que la
            guía se emite sin ningún dato del comprobante. Usa la terna
            serie/número/tipo en su lugar.
          example: "46c6ce9d-aaae-4b8d-8e94-a6f94c964b47"
        serie_documento:
          type: string
          example: "F001"
        numero_documento:
          type: string
          example: "190"
        codigo_tipo_documento:
          type: string
          example: "01"

    DocumentoRelacionado:
      type: object
      properties:
        numero:
          type: string
          example: "F001-1"
        empresa:
          type: string
          description: >-
            Razón social de quien emitió el documento. **Solo se imprime en el PDF**: no viaja
            en el XML.
          example: "EMPRESA ABC S.A.C."
        ruc:
          type: string
          description: >-
            RUC de la empresa que emitió el documento. Con códigos distintos de "01", "03",
            "04", "09", "12" y "48" es el que viaja al XML como emisor (`IssuerParty`) si
            tiene 11 dígitos; con esos códigos el emisor es siempre la empresa de la guía.
            Si en uno de esos otros códigos el `ruc` no tiene 11 dígitos, el XML lleva el RUC
            de tu empresa como emisor y la respuesta lo avisa con 3409.
          example: "20123456789"
        documento:
          type: object
          properties:
            id:
              type: string
              description: Código del Catálogo N.° 61.
              example: "01"
            descripcion:
              type: string
              maxLength: 120
              description: >-
                Nombre del tipo de documento. **Recomendada**: sin ella el XML sale con
                `cbc:DocumentType` vacío y SUNAT observa 4371, que sale como aviso previo.
                Hasta 120 caracteres y sin saltos de línea ni tabuladores, o SUNAT observa 4372.
              example: "Factura Electrónica"

    Leyenda:
      type: object
      properties:
        codigo:
          type: string
          example: "2000"
        valor:
          type: string
          example: "LEYENDA"

    Acciones:
      type: object
      description: Opcional. Acciones posteriores a la generación.
      properties:
        enviar_email:
          type: boolean
          description: Envía la guía al correo del cliente.
          example: false
        formato_pdf:
          type: string
          description: '"a4", "ticket" o "ticket_58".'
          example: "a4"
        auto_print:
          type: boolean
          description: Impresión automática en el servidor (requiere impresoras configuradas).
          example: false
        name_printer:
          type: string
          description: Nombre de la impresora destino para `auto_print`.
          example: ""

    RespuestaGuia:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            number:
              type: string
              example: "T001-1"
            filename:
              type: string
              example: "12312312312-09-T001-1"
            external_id:
              type: string
              description: >-
                Identificador único de la guía. Guardarlo — se usa en
                `POST /api/dispatches/send` y `POST /api/dispatches/status_ticket`.
              example: "2c1a2e6a-680d-4b60-96fc-6eb568971e44"
            warnings:
              type: array
              description: >-
                Avisos previos: lo que SUNAT va a observar o rechazar. **No bloquean**: la guía
                ya se emitió. Campo aditivo. Desde el 2026-09-14 incluye los del régimen de
                vehículos y conductores del transportista (3357, 2566, 3616, 4399) y los de
                autorizaciones especiales que no se emitirán (4394, 4395, 4397, 4403, 4405,
                4407), y también llega en las filas de `POST /api/offline/sync-batch`. Desde el
                2026-09-15 suma los del documento relacionado (4371, 4372, 3409), el formato del
                número de autorización (4396, 4406), el conductor secundario sin tipo de
                documento (2570) y cuatro **avisos del sistema**, con código no numérico porque
                no vienen de SUNAT: `REDONDEO_PESO`, `REDONDEO_CANTIDAD`,
                `SECUNDARIO_INCOMPLETO` y `AUTORIZACION_NO_EMITIDA`. Desde el 2026-09-16 suma
                los de la descripción del motivo: `RECORTE_DESCRIPCION_MOTIVO` (más de 100
                caracteres, viaja cortada) y 4190 (motivo "13" con menos de 3 letras). Lista
                completa en [Avisos antes de emitir](/devs/api/guias-de-remision#avisos-antes-de-emitir).
              items:
                type: object
                properties:
                  codigo:
                    type: string
                    example: "4399"
                  campo:
                    type: string
                    example: "vehiculo_secundario.0.certificado_habilitacion_vehicular"
                  mensaje:
                    type: string
                    example: "El vehículo de placa «DEF456» no tiene TUC ni certificado de habilitación vehicular. SUNAT aceptará la guía pero la observará."
      required:
        - success
        - data

    ErrorNoAutenticado:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "No se encuentra autenticado"

    ErrorLicencia:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Emisión bloqueada por licencia."
        message_code:
          type: string
          description: '"LICENSE_TENANT_BLOCKED" (tenant suspendido) o "LICENSE_EMISSION_BLOCKED" (emisión bloqueada).'
          example: "LICENSE_EMISSION_BLOCKED"

    ErrorValidacion:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: object
          description: Objeto con los errores por campo.
          example:
            direccion_partida.direccion: ["El campo direccion partida.direccion es obligatorio."]

    ErrorNegocio:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "La serie ingresada T001, es incorrecta."

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |-
        Token de la cuenta (columna "Api Token" en Configuración → Usuarios,
        o campo `token` de la respuesta de `POST /api/login`).
        Enviar en cada petición: `Authorization: Bearer <TOKEN>`.
