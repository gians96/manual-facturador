openapi: 3.0.3
info:
  title: Introducción
  description: |-
    La API del **Facturador** permite emitir comprobantes de pago electrónicos (CPE) y
    obtener por cada uno los 3 archivos indispensables: **XML Firmado, PDF y CDR**.

    Documentos contemplados:

    1. Factura
    2. Boleta
    3. Nota de Crédito
    4. Nota de Débito
    5. Resúmenes diarios (boletas)
    6. Anulaciones (comunicación de baja)
    7. Guía de remisión (remitente y transportista)
    8. Cotización
    9. Inventarios
    10. Productos

    **Autenticación:** todas las peticiones requieren el token de la cuenta enviado en el
    encabezado `Authorization: Bearer <TOKEN>` junto con `Accept: application/json`.
    El token se obtiene en el módulo **Configuración → Usuarios** del sistema (columna
    "Api Token") o mediante `POST /api/login` con el correo y contraseña del usuario.
  version: "8.0.0"
servers:
  - url: https://tu-dominio.com
    description: "Producción: reemplazar por el dominio de tu empresa"
  - url: https://tu-dominio.com
    description: Demostración
tags:
  - name: api
    description: Emisión de comprobantes electrónicos (CPE)

paths:
  /api/dispatches:
    post:
      tags:
        - api
      summary: Remitente | Transporte Público
      description: |
        La **Guía de Remisión Remitente** (`codigo_tipo_documento: "09"`) sustenta el traslado
        de bienes. En la modalidad de **transporte público** (`codigo_modo_transporte: "01"`)
        el traslado lo realiza una empresa transportista contratada: se envía el bloque
        `transportista` con el RUC y la razón social de la empresa de transporte.

        **Vehículos y conductores del transportista** (desde el 2026-09-14). Si el remitente
        declara el vehículo y el conductor de la empresa de transporte (indicador SUNAT
        `SUNAT_Envio_IndicadorVehiculoConductoresTransp`), envía
        `indicador_vehiculos_conductores_transportista: true` junto con `chofer` y `vehiculo`, y
        opcionalmente `chofer_secundario` y `vehiculo_secundario`. Sin esa clave, `chofer` y
        `vehiculo` se **descartan** en transporte público, como siempre. Con ella la guía lleva la
        fecha de inicio del traslado, los conductores, las placas, el TUC de cada vehículo y sus
        autorizaciones especiales. Es el ejemplo *Vehículos y conductores del transportista*.

        **Tracto y remolque.** SUNAT no tiene un campo de semirremolque: el tracto va en
        `vehiculo` y el **remolque o semirremolque** en `vehiculo_secundario`, cada uno con su
        placa y su propia constancia de inscripción (`certificado_habilitacion_vehicular`). En el
        PDF salen como filas *Principal* y *Secundario* de la tabla de vehículos. Es el ejemplo
        *Retorno a almacén con tracto y remolque*.

        **Materiales o residuos peligrosos.** La guía no tiene una marca de «material peligroso».
        El permiso se declara como **autorización especial** (número y entidad del catálogo D-37)
        del transportista, de cada vehículo o de ambos, según a quién se otorgó; opcionalmente se
        cita también en `documento_relacionado` (por ejemplo el "76" de residuos sólidos, con el
        RUC del transportista).

        **Autorizaciones especiales.** El transportista y cada vehículo pueden llevar
        `numero_autorizacion_especial` y `codigo_entidad_autorizadora` (catálogo D-37). Solo se
        emiten si vienen **los dos** y la entidad es del catálogo: no hay entidad por defecto. Si
        falta uno o la entidad no existe, la guía se emite sin la autorización y la respuesta lo
        dice en `warnings`.

        **Flujo completo de una guía de remisión:**
        1. `POST /api/dispatches` → genera la guía (XML firmado + PDF) y devuelve `external_id`.
           Este paso **no** envía a SUNAT.
        2. `POST /api/dispatches/send` con `{"external_id": "..."}` → envía al API GRE de SUNAT
           y obtiene el número de ticket (la guía pasa a estado `03` Enviado).
        3. `POST /api/dispatches/status_ticket` con `{"external_id": "..."}` → consulta el ticket,
           descarga el CDR y actualiza el estado (`05` Aceptado).

        ***Ejemplo:***
         - **Método:** POST
         - **URL:** `https://tu-dominio.com/api/dispatches`
         - **Encabezados:** `Authorization: Bearer <TU_TOKEN>`, `Accept: application/json` y `Content-Type: application/json`

        > **Sí se puede probar, y sin tramitar credenciales.** Con **SOAP Tipo = Demo**
        > (`soap_type_id = 01`) el sistema **descarta** el usuario secundario y el `client_id` /
        > `client_secret` que haya configurados, y envía al emulador de NubeFact con credenciales
        > de prueba ya incorporadas. Los cuatro campos pueden quedar vacíos y tampoco hace falta
        > certificado digital propio.
        >
        > Lo que no tiene ambiente beta es la **API REST de SUNAT**: el `e-beta.sunat.gob.pe` que
        > aparece al buscar pertenece al servicio SOAP de guías, que este flujo no usa. En
        > **Producción** sí hacen falta el `client_id` / `client_secret` del API GRE y el usuario
        > secundario; sin ellos el envío responde
        > `{"success":false,"message":"Code: 0 - Message: Error al obtener token..."}`.
        >
        > Cómo probar paso a paso: [Modo de pruebas](/devs/api/guias-de-remision#modo-de-pruebas).
      operationId: remitenteTransportePublico
      requestBody:
        description: JSON a enviar
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuiaRemitentePublicoRequest'
            examples:
              vehiculos_del_transportista:
                summary: Vehículos y conductores del transportista (motivo 14, datos ficticios)
                description: >-
                  Venta sujeta a confirmación del comprador con el indicador de vehículos y
                  conductores del transportista, un conductor y un vehículo secundarios, TUC,
                  autorizaciones especiales y la autorización de residuos sólidos del
                  transportista como documento relacionado "76", con su descripción. Todos
                  los datos son ficticios. La entidad D-37 "06" (MTC) de las autorizaciones es
                  de ejemplo: en cada una va el código de la entidad que la otorgó.
                value:
                  serie_documento: "T001"
                  numero_documento: "#"
                  fecha_de_emision: "2026-09-11"
                  hora_de_emision: "10:00:00"
                  codigo_tipo_documento: "09"
                  datos_del_cliente_o_receptor:
                    codigo_tipo_documento_identidad: "6"
                    numero_documento: "20000000001"
                    apellidos_y_nombres_o_razon_social: "MINERA DEMO S.A.C."
                    codigo_pais: "PE"
                    ubigeo: "150101"
                    direccion: "Av. Ejemplo 123 - Lima"
                  codigo_motivo_traslado: "14"
                  descripcion_motivo_traslado: "Venta sujeta a confirmación del comprador"
                  codigo_modo_transporte: "01"
                  fecha_de_traslado: "2026-09-12"
                  fecha_entrega_transporte: "2026-09-11"
                  indicador_de_transbordo: false
                  indicador_vehiculos_conductores_transportista: true
                  unidad_peso_total: "TNE"
                  peso_total: 12.5
                  numero_de_bultos: 1
                  observaciones: "Precintos 000123 y 000124"
                  direccion_partida:
                    ubigeo: "150101"
                    direccion: "Av. Almacén 456 - Lima"
                    codigo_del_domicilio_fiscal: "0000"
                  direccion_llegada:
                    ubigeo: "070101"
                    direccion: "Jr. Destino 789 - Callao"
                    codigo_del_domicilio_fiscal: "0000"
                  transportista:
                    codigo_tipo_documento_identidad: "6"
                    numero_documento: "20000000002"
                    apellidos_y_nombres_o_razon_social: "TRANSPORTES DEMO S.R.L."
                    numero_mtc: "1500001CNG"
                    numero_autorizacion_especial: "1500002MRP"
                    codigo_entidad_autorizadora: "06"
                  chofer:
                    codigo_tipo_documento_identidad: "1"
                    numero_documento: "12345678"
                    nombres: "PEREZ GARCIA, JUAN"
                    numero_licencia: "Q12345678"
                  chofer_secundario:
                    - codigo_tipo_documento_identidad: "1"
                      numero_documento: "87654321"
                      nombres: "QUISPE ROJAS, PEDRO"
                      numero_licencia: "Q87654321"
                  vehiculo:
                    numero_de_placa: "ABC123"
                    certificado_habilitacion_vehicular: "15MRP00000001E"
                    numero_autorizacion_especial: "1500003CNG"
                    codigo_entidad_autorizadora: "06"
                  vehiculo_secundario:
                    - numero_de_placa: "DEF456"
                      certificado_habilitacion_vehicular: "15MRP00000002E"
                      numero_autorizacion_especial: "1500004CNG"
                      codigo_entidad_autorizadora: "06"
                  documento_relacionado:
                    - numero: "1500002MRP"
                      empresa: "TRANSPORTES DEMO S.R.L."
                      ruc: "20000000002"
                      documento:
                        id: "76"
                        descripcion: "Autorización para manejo y recojo de residuos sólidos peligrosos y no peligrosos"
                  items:
                    - codigo_interno: "P0001"
                      descripcion: "RESIDUOS SOLIDOS NO PELIGROSOS"
                      unidad_de_medida: "TNE"
                      cantidad: 12.5
              retorno_almacen_tracto_remolque:
                summary: Retorno a almacén con tracto y remolque (motivo 13, datos ficticios)
                description: >-
                  Tu empresa es a la vez remitente y destinataria (en el ejemplo, RUC ficticio
                  20000000001): vuelve la carga a tu almacén después de pesarla en una balanza.
                  El motivo 13 lleva su descripción, que viaja en `cbc:HandlingInstructions`. El
                  tracto va en `vehiculo` y el remolque en `vehiculo_secundario`, cada uno con su
                  constancia. La autorización para residuos peligrosos es del transportista (con
                  la entidad D-37 que la otorgó; "06" MTC es de ejemplo) y además se cita como
                  documento relacionado "76". Todos los datos son ficticios.
                value:
                  serie_documento: "T001"
                  numero_documento: "#"
                  fecha_de_emision: "2026-09-16"
                  hora_de_emision: "17:57:13"
                  codigo_tipo_documento: "09"
                  datos_del_cliente_o_receptor:
                    codigo_tipo_documento_identidad: "6"
                    numero_documento: "20000000001"
                    apellidos_y_nombres_o_razon_social: "MI EMPRESA DEMO S.A.C."
                  codigo_motivo_traslado: "13"
                  descripcion_motivo_traslado: "RETORNO A NUESTRO ALMACEN POR PESAJE EN BALANZA"
