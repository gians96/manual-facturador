openapi: 3.0.3
info:
  title: Introducción
  description: |-
    La API del **Facturador** permite emitir comprobantes de pago electrónicos (CPE) y
    obtener por cada uno los 3 archivos indispensables: **XML Firmado, PDF y CDR**.

    Documentos contemplados:

    1. Factura
    2. Boleta
    3. Nota de Crédito
    4. Nota de Débito
    5. Resúmenes diarios (boletas)
    6. Anulaciones (comunicación de baja)
    7. Guía de remisión (remitente y transportista)
    8. Cotización
    9. Inventarios
    10. Productos

    **Autenticación:** todas las peticiones requieren el token de la cuenta enviado en el
    encabezado `Authorization: Bearer <TOKEN>` junto con `Accept: application/json`.
    El token se obtiene en el módulo **Configuración → Usuarios** del sistema (columna
    "Api Token") o mediante `POST /api/login` con el correo y contraseña del usuario.
  version: "8.0.0"
servers:
  - url: https://tu-dominio.com
    description: "Producción: reemplazar por el dominio de tu empresa"
  - url: https://tu-dominio.com
    description: Demostración
tags:
  - name: api
    description: Emisión de comprobantes electrónicos (CPE)

paths:
  /api/dispatch-carrier:
    post:
      tags:
        - api
      summary: Guía del Transportista (31)
      description: |
        La **Guía de Remisión Transportista** (`codigo_tipo_documento: "31"`) la emite la
        empresa que presta el servicio de transporte. Tiene **endpoint propio**,
        `POST /api/dispatch-carrier`, distinto del de la guía remitente, y la estructura
        también cambia:

        - **No** lleva `datos_del_cliente_o_receptor`, `codigo_modo_transporte` ni `transportista`.
        - Lleva `datos_remitente` y `datos_destinatario` (las partes del traslado) y sus
          direcciones en `direcciones_proveedores`.
        - `chofer` y `vehiculo` son obligatorios.
        - `direccion_partida` y `direccion_llegada` **no intervienen**: el domicilio viaja en
          `direcciones_proveedores`.

        > **Corregido el 2026-09-08.** Hasta esa fecha esta página documentaba
        > `POST /api/dispatches`, que **siempre responde 422** con una guía transportista:
        > ese endpoint anula `direccion_partida` y `direccion_llegada` para todo lo que no
        > sea tipo `09` y acto seguido las exige, así que no existe payload que lo satisfaga.
        > El endpoint correcto es `POST /api/dispatch-carrier`, y `direccion_partida` /
        > `direccion_llegada` no intervienen: el domicilio viaja en `direcciones_proveedores`.

        **Flujo completo de una guía de remisión:**
        1. `POST /api/dispatch-carrier` → genera la guía (XML firmado + PDF) y devuelve `external_id`.
           Este paso **no** envía a SUNAT.
        2. `POST /api/dispatches/send` con `{"external_id": "..."}` → envía al API GRE de SUNAT
           y obtiene el número de ticket (la guía pasa a estado `03` Enviado).
        3. `POST /api/dispatches/status_ticket` con `{"external_id": "..."}` → consulta el ticket,
           descarga el CDR y actualiza el estado (`05` Aceptado).

        ***Ejemplo:***
         - **Método:** POST
         - **URL:** `https://tu-dominio.com/api/dispatch-carrier`
         - **Encabezados:** `Authorization: Bearer <TU_TOKEN>`, `Accept: application/json` y `Content-Type: application/json`

        > **Sí se puede probar, y sin tramitar credenciales.** Con **SOAP Tipo = Demo**
        > (`soap_type_id = 01`) el sistema **descarta** el usuario secundario y el `client_id` /
        > `client_secret` que haya configurados, y envía al emulador de NubeFact con credenciales
        > de prueba ya incorporadas. Los cuatro campos pueden quedar vacíos y tampoco hace falta
        > certificado digital propio.
        >
        > Lo que no tiene ambiente beta es la **API REST de SUNAT**: el `e-beta.sunat.gob.pe` que
        > aparece al buscar pertenece al servicio SOAP de guías, que este flujo no usa. En
        > **Producción** sí hacen falta el `client_id` / `client_secret` del API GRE y el usuario
        > secundario; sin ellos el envío responde
        > `{"success":false,"message":"Code: 0 - Message: Error al obtener token..."}`.
        >
        > Cómo probar paso a paso: [Modo de pruebas](/devs/api/guias-de-remision#modo-de-pruebas).
      operationId: generarGuiaRemisionTransportista
      requestBody:
        description: JSON a enviar
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuiaTransportistaRequest'
        required: true
      responses:
        '200':
          description: Guía generada correctamente (XML firmado y PDF; aún sin enviar a SUNAT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaGuia'
        '401':
          description: Token inválido o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNoAutenticado'
        '403':
          description: Bloqueo por licencia (tenant suspendido o emisión bloqueada)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorLicencia'
        '422':
          description: |-
            Entrada rechazada por ser atribuible al integrador. Mensajes reales:
            - `"La serie ingresada V001, es incorrecta."`
            - `"El código ingresado del establecimiento es incorrecto."`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
        '500':
          description: |-
            Fallo no controlado. El caso más frecuente es enviar un bloque opcional
            a medias: el sistema lee sus sub-claves directamente, así que una ausencia
            sale como `"Undefined array key \"...\""` en vez de como un 422 con nombre.
            Ejemplo: `datos_remitente` sin `numero_documento`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
      security:
        - bearerAuth: []

components:
  schemas:
    GuiaTransportistaRequest:
      type: object
      required:
        - serie_documento
        - numero_documento
        - fecha_de_emision
        - hora_de_emision
        - codigo_tipo_documento
        - codigo_motivo_traslado
        - fecha_de_traslado
        - indicador_de_transbordo
        - unidad_peso_total
        - peso_total
        - datos_remitente
        - datos_destinatario
        - direcciones_proveedores
        - chofer
        - vehiculo
        - items
      properties:
        serie_documento:
          type: string
          description: Serie de guía de remisión transportista (tipo 31). Debe existir en el sistema.
          example: "V001"
        numero_documento:
          type: string
          description: Correlativo. Usar "#" para que el sistema lo asigne automáticamente (recomendado).
          example: "#"
        fecha_de_emision:
          type: string
          format: date
          example: "2026-07-22"
        hora_de_emision:
          type: string
          example: "10:11:11"
        codigo_tipo_documento:
          type: string
          description: '"31" Guía de Remisión Transportista.'
          example: "31"
        datos_del_emisor:
          description: |-
            Opcional desde el 2026-09-09. Si no se envía, se usa el establecimiento
            del usuario del token, igual que en `POST /api/documents`. Si se envía
            con un código que no existe, sigue siendo un 422 `INVALID_ESTABLISHMENT`.
          allOf:
            - $ref: '#/components/schemas/DatosDelEmisor'
        codigo_motivo_traslado:
          type: string
          description: >-
            Catálogo 20 SUNAT, según la RS 000240-2024. Catorce códigos: "01" Venta,
            "02" Compra, "03" Venta con entrega a terceros, "04" Traslado entre
            establecimientos de la misma empresa, "05" Consignación, "06" Devolución,
            "07" Recojo de bienes transformados, "08" Importación, "09" Exportación,
            "13" Otros (requiere `descripcion_motivo_traslado`), "14" Venta sujeta a
            confirmación del comprador, "17" Traslado de bienes para transformación,
            "18" Traslado por emisor itinerante de comprobantes de pago, "19" Traslado
            de mercancía extranjera.
          example: "01"
        descripcion_motivo_traslado:
          type: string
          description: Obligatoria cuando `codigo_motivo_traslado` es "13" Otros; opcional en el resto.
          example: "Traslado por venta"
        fecha_de_traslado:
          type: string
          format: date
          example: "2026-07-22"
        indicador_de_transbordo:
          type: boolean
          description: '**Obligatorio**: si se omite, la inserción en base de datos falla.'
          example: false
        unidad_peso_total:
          type: string
          description: Unidad del peso bruto total. Usar "KGM" (kilogramos).
          example: "KGM"
        peso_total:
          type: number
          example: 30
        numero_de_bultos:
          type: number
          description: Opcional.
          example: 1
        numero_de_contenedor:
          type: integer
          nullable: true
          description: >-
            Opcional (solo importación/exportación). La columna es numérica: un
            código ISO 6346 alfanumérico como "MSKU1234567" se rechaza con
            INVALID_NUMERIC_VALUE. Si no aplica, envía null — nunca cadena vacía.
          example: null
        codigo_de_puerto:
          type: string
          nullable: true
          description: >-
            Código del puerto (Catálogo N.° 63) o del aeropuerto (Catálogo N.° 64).
            **Obligatorio con `codigo_motivo_traslado` "19"**: sin él SUNAT rechaza
            con 3483. Opcional en "08" y "09". Debe ir acompañado de
            `tipo_de_puerto`: si envías uno sin el otro, la guía sale sin el dato y
            SUNAT observa (4413, 4415). El ubigeo del puerto tiene que coincidir con
            el de `direccion_partida`, o SUNAT rechaza con 3364.
          example: "CLL"
        tipo_de_puerto:
          type: string
          nullable: true
          enum: ["1", "2"]
          description: >-
            "1" puerto, "2" aeropuerto. Hace falta porque el mismo código puede ser
            las dos cosas: "IQT" es el puerto de Iquitos y también el aeropuerto
            Coronel FAP Francisco Secada Vignetta.
          example: "1"
        fecha_entrega_transporte:
          type: string
          format: date
          description: Opcional. Fecha de entrega de los bienes al transportista.
          example: "2026-07-22"
        datos_remitente:
          $ref: '#/components/schemas/ParteTraslado'
        datos_destinatario:
          $ref: '#/components/schemas/ParteTraslado'
        direcciones_proveedores:
          type: object
          description: Direcciones del remitente y del destinatario.
          required:
            - remitente
            - destinatario
          properties:
            remitente:
              $ref: '#/components/schemas/DireccionParte'
            destinatario:
              $ref: '#/components/schemas/DireccionParte'
        chofer:
          $ref: '#/components/schemas/Chofer'
        vehiculo:
          $ref: '#/components/schemas/Vehiculo'
        items:
          type: array
          minItems: 1
          description: Bienes a trasladar.
          items:
            $ref: '#/components/schemas/ItemGuia'
        observaciones:
          type: string
          description: Opcional.
          example: ""
        comprobante_de_referencia:
          $ref: '#/components/schemas/ComprobanteDeReferencia'
        documento_afectado:
          $ref: '#/components/schemas/DocumentoAfectado'
        documento_relacionado:
          type: array
          description: >-
            Otros documentos relacionados al traslado (Catálogo N.° 61).
            **Obligatorio en los motivos aduaneros**, donde SUNAT rechaza si falta:
            "08" y "09" exigen una DAM ("50") o una DS ("52") o devuelven 3440, y
            "19" exige "50", "52", "91" (manifiesto de carga) o "92" (cita del
            terminal portuario) o devuelve 3493.
            El número de la DAM y de la DS es `aduana(3)-año(4)-régimen(2)-correlativo(1..6)`
            y **el régimen depende del motivo**, o SUNAT rechaza con 3441:
            "10" en importación, "40" en exportación (DS: "18" y "48"). En el motivo
            "19" la DAM admite "10", "20", "21", "30", "36", "70" y "80".
          items:
            $ref: '#/components/schemas/DocumentoRelacionado'
        leyendas:
          type: array
          description: Opcional.
          items:
            $ref: '#/components/schemas/Leyenda'
        acciones:
          $ref: '#/components/schemas/Acciones'

    DatosDelEmisor:
      type: object
      description: >-
        Datos del establecimiento emisor (la empresa de transporte). `codigo_del_domicilio_fiscal`
        es obligatorio ("0000" = domicilio fiscal principal); con un código inexistente responde
        500 "El código ingresado del establecimiento es incorrecto."
      required:
        - codigo_del_domicilio_fiscal
      properties:
        codigo_del_domicilio_fiscal:
          type: string
          example: "0000"

    ParteTraslado:
      type: object
      description: >-
        Remitente / destinatario del traslado. Las 4 claves son obligatorias
        (el backend las accede directamente).
      required:
        - codigo_tipo_documento_identidad
        - descripcion_tipo_documento_identidad
        - numero_documento
        - apellidos_y_nombres_o_razon_social
      properties:
        codigo_tipo_documento_identidad:
          type: string
          description: Catálogo 06 SUNAT. "6" RUC, "1" DNI.
          example: "6"
        descripcion_tipo_documento_identidad:
          type: string
          example: "RUC"
        numero_documento:
          type: string
          example: "20123456789"
        apellidos_y_nombres_o_razon_social:
          type: string
          example: "EMPRESA XYZ S.A."

    DireccionParte:
      type: object
      description: Dirección de la parte (remitente o destinatario).
      required:
        - ubigeo
        - direccion
      properties:
        ubigeo:
          type: string
          description: Código de ubigeo INEI de 6 dígitos.
          example: "150101"
        direccion:
          type: string
          example: "Av. 2 de Mayo 123 - Lima"

    DireccionTraslado:
      type: object
      description: >-
        Punto de partida / llegada del traslado. Obligatoria también para el tipo 31.
        Las 3 claves son obligatorias (el backend las accede directamente). En
        `codigo_del_domicilio_fiscal` usar "0000" si el punto no corresponde a un
        establecimiento anexo declarado en SUNAT.
      required:
        - ubigeo
        - direccion
        - codigo_del_domicilio_fiscal
      properties:
        ubigeo:
          type: string
          description: Código de ubigeo INEI de 6 dígitos.
          example: "150101"
        direccion:
          type: string
          maxLength: 100
          description: Dirección del punto (máximo 100 caracteres).
          example: "Av. 2 de Mayo 123 - Lima"
        codigo_del_domicilio_fiscal:
          type: string
          description: Código de establecimiento anexo declarado en SUNAT; "0000" si no aplica.
          example: "0000"

    Chofer:
      type: object
      description: Datos del conductor (obligatorio en la guía del transportista).
      required:
        - codigo_tipo_documento_identidad
        - numero_documento
        - nombres
        - numero_licencia
      properties:
        codigo_tipo_documento_identidad:
          type: string
          description: Catálogo 06 SUNAT. "1" DNI.
          example: "1"
        numero_documento:
          type: string
          example: "41784439"
        nombres:
          type: string
          description: Nombres y apellidos del conductor.
          example: "JUAN PEREZ"
        numero_licencia:
          type: string
          example: "Q41784439"
        telefono:
          type: string
          description: Opcional.
          example: "999888777"

    Vehiculo:
      type: object
      description: Datos del vehículo (obligatorio en la guía del transportista).
      required:
        - numero_de_placa
      properties:
        numero_de_placa:
          type: string
          example: "ABC123"
        modelo:
          type: string
          description: Opcional.
          example: "YARIS"
        marca:
          type: string
          description: Opcional.
          example: "TOYOTA"
        certificado_habilitacion_vehicular:
          type: string
          description: Opcional. TUC / certificado de habilitación vehicular.
          example: ""

    ItemGuia:
      type: object
      required:
        - codigo_interno
        - descripcion
        - unidad_de_medida
        - cantidad
      properties:
        codigo_interno:
          type: string
          description: >-
            Código del producto. Si no existe, el producto se crea automáticamente
            (en ese caso enviar también `valor_unitario` y `codigo_tipo_afectacion_igv`).
          example: "P0121"
        descripcion:
          type: string
          example: "Inca Kola 250 ml"
        nombre:
          type: string
          description: Opcional. Nombre del producto (usado al crear el producto nuevo).
          example: "Inca Kola 250 ml"
        unidad_de_medida:
          type: string
          description: Catálogo de unidades SUNAT ("NIU" unidad, "ZZ" servicio, etc.).
          example: "NIU"
        cantidad:
          type: number
          example: 2
        valor_unitario:
          type: number
          description: |-
            Opcional. Una guía de remisión no lleva importes: `dispatch_items` no tiene
            columna de precio y el XML solo emite cantidad, descripción y código. Solo se
            usa al dar de alta un producto que aún no existe, y desde el 2026-09-09
            tampoco hace falta entonces: el producto nace con precio 0, visible en el
            panel para corregirlo. Se acepta igualmente en `precio_unitario`.
          example: 50
        codigo_tipo_afectacion_igv:
          type: string
          description: Catálogo 07 SUNAT ("10" gravado, "20" exonerado, "30" inafecto). Necesario solo si el producto se crea nuevo.
          example: "10"

    ComprobanteDeReferencia:
      type: object
      description: >-
        Opcional. Comprobante (factura o boleta) que origina el traslado, **enlazado de
        verdad**: escribe la clave foránea, de modo que la guía deja de figurar como
        pendiente de facturar, el listado muestra su N.º de comprobante y el PDF lo imprime.
        Si no envías `documento_relacionado`, además lo deriva de aquí para que el
        `cac:AdditionalDocumentReference` salga en el XML.


        Disponible desde el 2026-09-08. **Efecto sobre el stock:** con esta clave la guía
        **no** descuenta existencias, porque ya las descontó el comprobante. Ver
        [Documentos relacionados](/devs/api/documentos-relacionados).


        Tres formas de nombrarlo, elige una: `external_id`; la terna
        `serie_documento` + `numero_documento` (+ `codigo_tipo_documento` para desambiguar);
        o `codigo`, el id interno.
      properties:
        external_id:
          type: string
          description: external_id que devolvió la API al emitir el comprobante. La forma recomendada.
          example: "46c6ce9d-aaae-4b8d-8e94-a6f94c964b47"
        serie_documento:
          type: string
          example: "F001"
        numero_documento:
          type: string
          description: >-
            Correlativo. Admite ceros a la izquierda y también la forma combinada "F001-190".
          example: "190"
        codigo_tipo_documento:
          type: string
          description: Opcional; solo hace falta si la serie-número pudiera existir en dos tipos.
          example: "01"
        codigo:
          type: integer
          description: Id interno del comprobante. Último recurso.
          example: 1234

    DocumentoAfectado:
      type: object
      description: >-
        Opcional. Comprobante que sustenta el traslado, **solo a efectos de impresión**: se
        guarda en la guía y se imprime en su PDF, pero **no viaja en el XML** que recibe
        SUNAT **ni relaciona los dos registros** en base de datos — la guía seguirá
        figurando como pendiente de facturar. Corregido el 2026-09-08: la redacción
        anterior («de un comprobante ya emitido en el sistema») hacía pensar en un enlace
        que nunca ocurría. Para que SUNAT vea el comprobante, usa `documento_relacionado`.
      properties:
        external_id:
          type: string
          description: >-
            **Hoy se ignora**: el sistema lo recibe y lo descarta sin avisar, de modo que la
            guía se emite sin ningún dato del comprobante. Usa la terna
            serie/número/tipo en su lugar.
          example: "46c6ce9d-aaae-4b8d-8e94-a6f94c964b47"
        serie_documento:
          type: string
          example: "F001"
        numero_documento:
          type: string
          example: "190"
        codigo_tipo_documento:
          type: string
          example: "01"

    DocumentoRelacionado:
      type: object
      properties:
        numero:
          type: string
          example: "F001-1"
        empresa:
          type: string
          example: "EMPRESA ABC S.A.C."
        ruc:
          type: string
          example: "20123456789"
        documento:
          type: object
          properties:
            id:
              type: string
              example: "01"
            descripcion:
              type: string
              example: "Factura Electrónica"

    Leyenda:
      type: object
      properties:
        codigo:
          type: string
          example: "2000"
        valor:
          type: string
          example: "LEYENDA"

    Acciones:
      type: object
      description: Opcional. Acciones posteriores a la generación.
      properties:
        enviar_email:
          type: boolean
          description: Envía la guía al correo del cliente.
          example: false
        formato_pdf:
          type: string
          description: '"a4", "ticket" o "ticket_58".'
          example: "a4"
        auto_print:
          type: boolean
          description: Impresión automática en el servidor (requiere impresoras configuradas).
          example: false
        name_printer:
          type: string
          description: Nombre de la impresora destino para `auto_print`.
          example: ""

    RespuestaGuia:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            number:
              type: string
              example: "V001-1"
            filename:
              type: string
              example: "12312312312-31-V001-1"
            external_id:
              type: string
              description: >-
                Identificador único de la guía. Guardarlo — se usa en
                `POST /api/dispatches/send` y `POST /api/dispatches/status_ticket`.
              example: "2c1a2e6a-680d-4b60-96fc-6eb568971e44"
      required:
        - success
        - data

    ErrorNoAutenticado:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "No se encuentra autenticado"

    ErrorLicencia:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Emisión bloqueada por licencia."
        message_code:
          type: string
          description: '"LICENSE_TENANT_BLOCKED" (tenant suspendido) o "LICENSE_EMISSION_BLOCKED" (emisión bloqueada).'
          example: "LICENSE_EMISSION_BLOCKED"

    ErrorValidacion:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          description: Motivo del rechazo, en texto plano.
          example: "La serie ingresada V001, es incorrecta."
        error_code:
          type: string
          description: >-
            Opcional. Código estable para ramificar sin parsear el mensaje.
          example: "MISSING_FIELDS"

    ErrorNegocio:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "La serie ingresada V001, es incorrecta."

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |-
        Token de la cuenta (columna "Api Token" en Configuración → Usuarios,
        o campo `token` de la respuesta de `POST /api/login`).
        Enviar en cada petición: `Authorization: Bearer <TOKEN>`.
