openapi: 3.0.3
info:
  title: Introducción
  description: |-
    La API del **Facturador** permite emitir comprobantes de pago electrónicos (CPE) y
    obtener por cada uno los 3 archivos indispensables: **XML Firmado, PDF y CDR**.

    Documentos contemplados:

    1. Factura
    2. Boleta
    3. Nota de Crédito
    4. Nota de Débito
    5. Resúmenes diarios (boletas)
    6. Anulaciones (comunicación de baja)
    7. Guía de remisión (remitente y transportista)
    8. Cotización
    9. Inventarios
    10. Productos

    **Autenticación:** todas las peticiones requieren el token de la cuenta enviado en el
    encabezado `Authorization: Bearer <TOKEN>` junto con `Accept: application/json`.
    El token se obtiene en el módulo **Configuración → Usuarios** del sistema (columna
    "Api Token") o mediante `POST /api/login` con el correo y contraseña del usuario.
  version: "8.0.0"
servers:
  - url: https://tu-dominio.com
    description: "Producción: reemplazar por el dominio de tu empresa"
  - url: https://tu-dominio.com
    description: Demostración
tags:
  - name: api
    description: Emisión de comprobantes electrónicos (CPE)

paths:
  /api/voided/status:
    post:
      tags:
        - api
      summary: CONSULTAR TICKET ANULACIÓN
      description: |
        Consulta ante SUNAT el estado de una **comunicación de baja** registrada previamente con
        `POST /api/voided`. Se puede identificar la anulación por su `external_id` **o** por su
        `ticket` (basta enviar uno de los dos).

        Cuando SUNAT acepta la comunicación (`response.code: "0"`), las facturas o notas que la
        conforman quedan **Anuladas** (`11`) y se dispone de los enlaces de descarga del **XML** y
        del **CDR** de la baja. Si SUNAT aún está procesando el ticket, responde 500 con
        `Code: 98; …`: repetir la consulta más tarde.

        Desde el 2026-09-26, `data` trae el estado de la **baja** (`state_type_id`: `05` aceptada,
        `09` rechazada; nunca `11`) y `documents`, cada comprobante con **su** estado (`11`
        Anulado si SUNAT aceptó). Para saber si una factura quedó anulada, búscala en
        `data.documents` por su `external_id`. Antes la respuesta no los listaba y había que
        preguntar cada uno con `GET /api/document_check_server/{external_id}` o
        `POST /api/documents/status`.

        **Solo `response.code: "0"` es aceptación.** Si SUNAT rechaza la baja (`status_code: 99`, o
        por PSE un código de CDR entre `2000` y `3999`),
        la baja queda en `09` y sus documentos vuelven a `05` (o `07`), que es lo que siguen siendo
        para SUNAT. Volver a consultar una baja ya resuelta no cambia ningún documento, salvo
        terminar los que se quedaron en `13` si fue aceptada. Hasta el
        2026-09-25, con envío directo a SUNAT, una baja rechazada los dejaba en `11`:
        [Si SUNAT rechaza la anulación](/devs/api/offline/endpoints/anular-notas-de-credito-y-debito#rechazo).

        ***Ejemplo:***
         - **Método:** POST
         - **URL:** `https://tu-dominio.com/api/voided/status`
         - **Encabezados:** `Authorization: Bearer <TU_TOKEN>`, `Accept: application/json` y `Content-Type: application/json`
      operationId: consultarTicketAnulacion
      requestBody:
        description: JSON a enviar (enviar `external_id` o `ticket`, al menos uno)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultaTicketRequest'
        required: true
      responses:
        '200':
          description: Estado de la comunicación de baja y de cada comprobante que lleva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaConsultaTicket'
        '401':
          description: Token inválido o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNoAutenticado'
        '403':
          description: Tenant suspendido por licencia (`LICENSE_TENANT_BLOCKED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorLicencia'
        '500':
          description: |
            Error de negocio. Mensajes típicos:
            - `Es requerido el código externo o ticket` (no se envió ninguno de los dos, o van
              vacíos)
            - `El código externo {external_id} es inválido, no se encontró anulación relacionada`
              (casi siempre: se mandó el `external_id` del comprobante, no el de la baja)
            - `El ticket {ticket} es inválido, no se encontró anulación relacionada`
            - `Code: 98; Description: El procesamiento del comprobante aún no ha terminado`
              (SUNAT aún procesa el ticket: se reintenta en unos minutos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
      security:
        - bearerAuth: []

components:
  schemas:
    ConsultaTicketRequest:
      type: object
      description: Enviar `external_id` o `ticket` (al menos uno de los dos).
      properties:
        external_id:
          type: string
          description: Identificador de la comunicación de baja (`data.external_id` de `POST /api/voided`). Alternativa a `ticket`.
          example: "f7f2f1c5-526f-4cb8-8320-f2df3cc8765c"
        ticket:
          type: string
          description: Ticket SUNAT devuelto al registrar la baja (`data.ticket`). Alternativa a `external_id`.
          example: "1784778800651"

    RespuestaConsultaTicket:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            external_id:
              type: string
              description: Identificador de la comunicación de baja.
              example: "45dd304a-3873-4e54-9470-26b61cfc0fb0"
            ticket:
              type: string
              nullable: true
              description: Ticket de la baja. Desde el 2026-09-26.
              example: "1790434357925"
            filename:
              type: string
              description: Nombre del archivo de la comunicación de baja (RUC-RA-fecha-correlativo).
              example: "20123456789-RA-20260926-1"
            date_of_reference:
              type: string
              description: Fecha de emisión de los comprobantes, en `aaaa-mm-dd`. Desde el 2026-09-26.
              example: "2026-09-26"
            state_type_id:
              type: string
              description: |-
                Estado de la **baja**: `05` si SUNAT la aceptó, `09` si la rechazó (`03` si sigue en
                proceso por un PSE). Nunca `11`: ese es el de los comprobantes. Desde el 2026-09-26.
              example: "05"
            state_type_description:
              type: string
              example: "Aceptado"
            documents:
              type: array
              description: |-
                Los comprobantes de la baja, con el estado que tienen **después** de consultar:
                `11` (Anulado) si SUNAT aceptó; si la rechazó, el de antes (`05`, o `07`). Desde el
                2026-09-26.
              items:
                $ref: '#/components/schemas/ComprobanteDeLaBaja'
        links:
          type: object
          properties:
            xml:
              type: string
              description: URL de descarga del XML firmado de la baja.
              example: "https://tu-dominio.com/downloads/voided/xml/45dd304a-3873-4e54-9470-26b61cfc0fb0"
            cdr:
              type: string
              description: URL de descarga del CDR emitido por SUNAT.
              example: "https://tu-dominio.com/downloads/voided/cdr/45dd304a-3873-4e54-9470-26b61cfc0fb0"
        response:
          type: object
          description: Respuesta de SUNAT.
          properties:
            sent:
              type: boolean
              example: true
            code:
              type: string
              description: '"0" indica aceptación. Cualquier otro código es un rechazo, aunque `is_accepted` o `success` digan otra cosa.'
              example: "0"
            description:
              type: string
              example: "La Comunicacion de baja RA-20260926-1, ha sido aceptada"
            notes:
              type: array
              items:
                type: string
              example: []
            is_accepted:
              type: boolean
              example: true
            status_code:
              type: integer
              description: '`0` aceptado; `99` rechazado.'
              example: 0
      required:
        - success
        - data

    ComprobanteDeLaBaja:
      type: object
      properties:
        id:
          type: integer
          example: 68
        external_id:
          type: string
          description: El que devolvió la emisión del comprobante.
          example: "3ab040b8-00e5-4548-9e90-767e9feb85b9"
        offline_id:
          type: string
          nullable: true
          description: El que mandó la integración a `sync-batch`; `null` si no vino por ahí.
          example: null
        document_type_id:
          type: string
          description: '`01` factura, `07` nota de crédito, `08` nota de débito.'
          example: "01"
        series:
          type: string
          example: "F001"
        number:
          type: integer
          example: 12
        number_full:
          type: string
          example: "F001-12"
        currency_type_id:
          type: string
          example: "PEN"
        total:
          type: string
          example: "118.00"
        state_type_id:
          type: string
          example: "11"
        state_type_description:
          type: string
          example: "Anulado"

    ErrorNoAutenticado:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "No se encuentra autenticado"

    ErrorLicencia:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Operación bloqueada: tenant suspendido por licencia."
        message_code:
          type: string
          example: "LICENSE_TENANT_BLOCKED"

    ErrorNegocio:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Es requerido el código externo o ticket"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |-
        Token de la cuenta (columna "Api Token" en Configuración → Usuarios,
        o campo `token` de la respuesta de `POST /api/login`).
        Enviar en cada petición: `Authorization: Bearer <TOKEN>`.
