openapi: 3.0.3
info:
  title: Introducción
  description: |-
    La API del **Facturador** permite emitir comprobantes de pago electrónicos (CPE) y
    obtener por cada uno los 3 archivos indispensables: **XML Firmado, PDF y CDR**.

    Documentos contemplados:

    1. Factura
    2. Boleta
    3. Nota de Crédito
    4. Nota de Débito
    5. Resúmenes diarios (boletas)
    6. Anulaciones (comunicación de baja)
    7. Guía de remisión (remitente y transportista)
    8. Cotización
    9. Inventarios
    10. Productos

    **Autenticación:** todas las peticiones requieren el token de la cuenta enviado en el
    encabezado `Authorization: Bearer <TOKEN>` junto con `Accept: application/json`.
    El token se obtiene en el módulo **Configuración → Usuarios** del sistema (columna
    "Api Token") o mediante `POST /api/login` con el correo y contraseña del usuario.
  version: "8.0.0"
servers:
  - url: https://tu-dominio.com
    description: "Producción: reemplazar por el dominio de tu empresa"
  - url: https://tu-dominio.com
    description: Demostración
tags:
  - name: api
    description: Emisión de comprobantes electrónicos (CPE)

paths:
  /api/voided/status:
    post:
      tags:
        - api
      summary: CONSULTAR TICKET ANULACIÓN
      description: |
        Consulta ante SUNAT el estado de una **comunicación de baja** registrada previamente con
        `POST /api/voided`. Se puede identificar la anulación por su `external_id` **o** por su
        `ticket` (basta enviar uno de los dos).

        Cuando SUNAT acepta la comunicación (`response.code: "0"`), las facturas o notas que la
        conforman quedan **Anuladas** y se dispone de los enlaces de descarga del **XML** y del
        **CDR** de la baja. Si SUNAT aún está procesando el ticket, repetir la consulta más tarde.

        ***Ejemplo:***
         - **Método:** POST
         - **URL:** `https://tu-dominio.com/api/voided/status`
         - **Encabezados:** `Authorization: Bearer <TU_TOKEN>`, `Accept: application/json` y `Content-Type: application/json`
      operationId: consultarTicketAnulacion
      requestBody:
        description: JSON a enviar (enviar `external_id` o `ticket`, al menos uno)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultaTicketRequest'
        required: true
      responses:
        '200':
          description: Estado de la comunicación de baja (aceptada por SUNAT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaConsultaTicket'
        '401':
          description: Token inválido o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNoAutenticado'
        '403':
          description: Bloqueo por licencia (tenant suspendido o emisión bloqueada)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorLicencia'
        '422':
          description: Error de validación de campos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
        '500':
          description: |
            Error de negocio. Mensajes típicos:
            - `Es requerido el código externo o ticket` (no se envió ninguno de los dos)
            - `El código externo {external_id} es inválido, no se encontró anulación relacionada`
            - `El ticket {ticket} es inválido, no se encontró anulación relacionada`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
      security:
        - bearerAuth: []

components:
  schemas:
    ConsultaTicketRequest:
      type: object
      description: Enviar `external_id` o `ticket` (al menos uno de los dos).
      properties:
        external_id:
          type: string
          description: Identificador de la comunicación de baja (`data.external_id` de `POST /api/voided`). Alternativa a `ticket`.
          example: "f7f2f1c5-526f-4cb8-8320-f2df3cc8765c"
        ticket:
          type: string
          description: Ticket SUNAT devuelto al registrar la baja (`data.ticket`). Alternativa a `external_id`.
          example: "1784778800651"

    RespuestaConsultaTicket:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            filename:
              type: string
              description: Nombre del archivo de la comunicación de baja (RUC-RA-fecha-correlativo).
              example: "20123456789-RA-20260722-1"
            external_id:
              type: string
              example: "f7f2f1c5-526f-4cb8-8320-f2df3cc8765c"
        links:
          type: object
          properties:
            xml:
              type: string
              description: URL de descarga del XML firmado de la baja.
              example: "https://tu-dominio.com/downloads/voided/xml/f7f2f1c5-526f-4cb8-8320-f2df3cc8765c"
            cdr:
              type: string
              description: URL de descarga del CDR emitido por SUNAT.
              example: "https://tu-dominio.com/downloads/voided/cdr/f7f2f1c5-526f-4cb8-8320-f2df3cc8765c"
        response:
          type: object
          description: Respuesta de SUNAT.
          properties:
            code:
              type: string
              description: '"0" indica aceptación.'
              example: "0"
            description:
              type: string
              example: "La Comunicación de baja RA-20260722-1, ha sido aceptada"
            notes:
              type: array
              items:
                type: string
              example: []
      required:
        - success
        - data

    ErrorNoAutenticado:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "No se encuentra autenticado"

    ErrorLicencia:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Emisión bloqueada por licencia."
        message_code:
          type: string
          description: '"LICENSE_TENANT_BLOCKED" (tenant suspendido) o "LICENSE_EMISSION_BLOCKED" (emisión bloqueada).'
          example: "LICENSE_EMISSION_BLOCKED"

    ErrorValidacion:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: object
          description: Objeto con los errores por campo.
          example:
            external_id: ["El campo external id debe ser una cadena de texto."]

    ErrorNegocio:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Es requerido el código externo o ticket"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |-
        Token de la cuenta (columna "Api Token" en Configuración → Usuarios,
        o campo `token` de la respuesta de `POST /api/login`).
        Enviar en cada petición: `Authorization: Bearer <TOKEN>`.
