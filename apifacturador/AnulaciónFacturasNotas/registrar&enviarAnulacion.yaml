openapi: 3.0.3
info:
  title: Introducción
  description: |-
    La API del **Facturador** permite emitir comprobantes de pago electrónicos (CPE) y
    obtener por cada uno los 3 archivos indispensables: **XML Firmado, PDF y CDR**.

    Documentos contemplados:

    1. Factura
    2. Boleta
    3. Nota de Crédito
    4. Nota de Débito
    5. Resúmenes diarios (boletas)
    6. Anulaciones (comunicación de baja)
    7. Guía de remisión (remitente y transportista)
    8. Cotización
    9. Inventarios
    10. Productos

    **Autenticación:** todas las peticiones requieren el token de la cuenta enviado en el
    encabezado `Authorization: Bearer <TOKEN>` junto con `Accept: application/json`.
    El token se obtiene en el módulo **Configuración → Usuarios** del sistema (columna
    "Api Token") o mediante `POST /api/login` con el correo y contraseña del usuario.
  version: "8.0.0"
servers:
  - url: https://tu-dominio.com
    description: "Producción: reemplazar por el dominio de tu empresa"
  - url: https://tu-dominio.com
    description: Demostración
tags:
  - name: api
    description: Emisión de comprobantes electrónicos (CPE)

paths:
  /api/voided:
    post:
      tags:
        - api
      summary: REGISTRAR Y ENVIAR ANULACIÓN
      description: |
        Las **facturas** y las **notas de crédito/débito generadas a partir de facturas** se anulan
        mediante una **comunicación de baja** enviada a SUNAT. Una misma comunicación puede agrupar
        uno o más documentos, siempre que todos hayan sido **emitidos en la fecha indicada** en
        `fecha_de_emision_de_documentos`.

        El proceso es **asíncrono**: al registrar la baja, SUNAT devuelve un **ticket**
        (`data.ticket`) y los documentos pasan a `13` **Por anular** (a `03` si la empresa envía
        por un PSE o por el OSE SendFact). Luego se debe consultar ese ticket con
        `POST /api/voided/status` hasta obtener la aceptación; recién entonces los documentos
        quedan **Anulados** (estado `11`).

        La respuesta trae el estado de la **baja** (`data.state_type_id`: `03` Enviado) y, en
        `data.documents`, cada comprobante con **su** estado (`13` Por anular). Desde el
        2026-09-26; antes solo traía `external_id` y `ticket`.

        **Notas importantes:**
        - La fecha va en **`aaaa-mm-dd`** (`"2026-09-25"`), como en el resto de la API, o en
          **`dd-mm-aaaa`** (`"25-09-2026"`): valen las dos. Hasta el 2026-09-26 solo valía
          `dd-mm-aaaa`, y `aaaa-mm-dd` respondía 500.
        - `external_id` es el identificador devuelto al emitir el comprobante
          (`data.external_id` de `POST /api/documents`). Da igual en mayúsculas o minúsculas.
        - Una **nota** va con **su** `external_id` y **su** fecha de emisión, no con las de la
          factura que modifica.
        - `motivo_anulacion` es obligatorio: es texto libre, no un código de catálogo, y viaja a
          SUNAT como motivo de la baja (`VoidReasonDescription`). Vacío, SUNAT la rechaza.
        - Se anulan comprobantes **aceptados** (`05`) u **observados** (`07`). Con otro estado
          responde 422 `DOCUMENT_NOT_VOIDABLE` antes de enviar nada (desde el 2026-09-25). El plazo
          (7 días por defecto) solo lo aplica el panel.
        - Las **boletas** y sus notas NO se anulan por este endpoint: se anulan vía resumen con
          `POST /api/summaries` y `codigo_tipo_proceso: "3"`.

        Las notas, de la emisión al CDR de la baja:
        [Anular una nota de crédito o de débito](/devs/api/offline/endpoints/anular-notas-de-credito-y-debito).

        ***Ejemplo:***
         - **Método:** POST
         - **URL:** `https://tu-dominio.com/api/voided`
         - **Encabezados:** `Authorization: Bearer <TU_TOKEN>`, `Accept: application/json` y `Content-Type: application/json`
      operationId: registrar&enviarAnulacion
      requestBody:
        description: JSON a enviar
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnulacionRequest'
        required: true
      responses:
        '200':
          description: Comunicación de baja registrada y enviada; SUNAT devolvió un ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaAnulacion'
        '401':
          description: Token inválido o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNoAutenticado'
        '403':
          description: Tenant suspendido por licencia (`LICENSE_TENANT_BLOCKED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorLicencia'
        '400':
          description: |
            No se pudo leer el cuerpo; corrígelo antes de reintentar: `MISSING_CONTENT_TYPE`
            (falta `Content-Type: application/json`), `EMPTY_BODY` o `INVALID_JSON`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '422':
          description: |
            La baja no se envió a SUNAT. No se reintenta: se corrige el cuerpo.
            - `MISSING_FIELDS` — falta `fecha_de_emision_de_documentos`, o en una fila
              `external_id` o `motivo_anulacion` (null o en blanco). `errors.faltantes` los nombra,
              por ejemplo `documentos[1].motivo_anulacion` (contando desde 1). Desde el 2026-09-26
            - `INVALID_DATE_FORMAT` — la fecha no es una fecha real en `aaaa-mm-dd` ni en
              `dd-mm-aaaa`: con barras, con hora, o imposible como `31-02-2026`. Desde el 2026-09-26
            - `NO_DOCUMENTS` — `No se enviaron documentos para la anulación.` (falta `documentos`,
              va vacío o no es una lista)
            - `AFFECTED_DOCUMENT_NOT_FOUND` — `El código externo {external_id} no fue encontrado o
              la fecha indica no corresponde al documento.` (la fecha no es la de emisión de ese
              comprobante, el `external_id` no existe en esta empresa, o es de una boleta o nota
              de boleta: esas van por `POST /api/summaries`)
            - `DOCUMENT_NOT_VOIDABLE` — `No se puede anular el comprobante {serie-número}: …` (no
              está en `05` ni `07`; `errors.estado` dice en cuál). Desde el 2026-09-25
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAnulacion'
        '500':
          description: |
            Con `Code: …; Description: …`, SUNAT no pudo atender la baja: no se guarda nada y se
            puede reintentar.

            En un servidor sin actualizar (antes del 2026-09-26), estos 500 son del cuerpo y no se
            envió nada: `Undefined array key "fecha_de_emision_de_documentos"` (falta la fecha),
            `The separation symbol could not be found` / `Trailing data` (la fecha no va en
            `dd-mm-aaaa`) y `Column 'description' cannot be null` (falta `motivo_anulacion`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
      security:
        - bearerAuth: []

components:
  schemas:
    AnulacionRequest:
      type: object
      properties:
        fecha_de_emision_de_documentos:
          type: string
          description: |-
            Fecha de emisión de los documentos a anular, en **aaaa-mm-dd** o en **dd-mm-aaaa**
            (valen las dos desde el 2026-09-26; antes, solo dd-mm-aaaa). Todos los documentos del
            array deben haber sido emitidos en esta fecha.
          example: "2026-09-25"
        documentos:
          type: array
          description: Documentos (facturas o notas de factura) que conforman la comunicación de baja.
          minItems: 1
          items:
            type: object
            required:
              - external_id
              - motivo_anulacion
            properties:
              external_id:
                type: string
                description: Identificador único del comprobante, devuelto al emitirlo (`data.external_id`).
                example: "46c6ce9d-aaae-4b8d-8e94-a6f94c964b47"
              motivo_anulacion:
                type: string
                description: Motivo de la anulación que se informará a SUNAT. Texto libre, no un código de catálogo.
                example: "Se duplicó documento"
      required:
        - fecha_de_emision_de_documentos
        - documentos

    RespuestaAnulacion:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            external_id:
              type: string
              description: Identificador único de la comunicación de baja (no el del comprobante). Guardarlo para consultar el estado.
              example: "45dd304a-3873-4e54-9470-26b61cfc0fb0"
            ticket:
              type: string
              nullable: true
              description: Ticket asignado por SUNAT. Consultarlo después con `POST /api/voided/status`. Puede ser `null` con PSE.
              example: "1790434357925"
            filename:
              type: string
              description: Nombre del archivo de la baja (RUC-RA-fecha del envío-correlativo). Desde el 2026-09-26.
              example: "20123456789-RA-20260926-1"
            date_of_reference:
              type: string
              description: Fecha de emisión de los comprobantes, en `aaaa-mm-dd`. Desde el 2026-09-26.
              example: "2026-09-26"
            state_type_id:
              type: string
              description: Estado de la **baja**, no de los comprobantes. Al registrarla, `03` (Enviado). Desde el 2026-09-26.
              example: "03"
            state_type_description:
              type: string
              example: "Enviado"
            documents:
              type: array
              description: Los comprobantes de la baja, en el orden del XML, con el estado que tienen después de enviarla. Desde el 2026-09-26.
              items:
                $ref: '#/components/schemas/ComprobanteDeLaBaja'
      required:
        - success
        - data

    ComprobanteDeLaBaja:
      type: object
      properties:
        id:
          type: integer
          example: 68
        external_id:
          type: string
          description: El que devolvió la emisión del comprobante.
          example: "3ab040b8-00e5-4548-9e90-767e9feb85b9"
        offline_id:
          type: string
          nullable: true
          description: El que mandó la integración a `sync-batch`; `null` si no vino por ahí.
          example: null
        document_type_id:
          type: string
          description: '`01` factura, `07` nota de crédito, `08` nota de débito.'
          example: "01"
        series:
          type: string
          example: "F001"
        number:
          type: integer
          example: 12
        number_full:
          type: string
          example: "F001-12"
        currency_type_id:
          type: string
          example: "PEN"
        total:
          type: string
          example: "118.00"
        state_type_id:
          type: string
          description: |-
            Estado del comprobante: `13` (Por anular) al enviar la baja directo a SUNAT; `03` por un
            PSE o por el OSE SendFact.
          example: "13"
        state_type_description:
          type: string
          example: "Por anular"

    ErrorNoAutenticado:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "No se encuentra autenticado"

    ErrorLicencia:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Operación bloqueada: tenant suspendido por licencia."
        message_code:
          type: string
          example: "LICENSE_TENANT_BLOCKED"

    ErrorAnulacion:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "El código externo 46c6ce9d-aaae-4b8d-8e94-a6f94c964b47 no fue encontrado o la fecha indica no corresponde al documento."
        error_code:
          type: string
          description: '"MISSING_FIELDS", "INVALID_DATE_FORMAT", "NO_DOCUMENTS", "AFFECTED_DOCUMENT_NOT_FOUND" o "DOCUMENT_NOT_VOIDABLE".'
          example: "AFFECTED_DOCUMENT_NOT_FOUND"
        errors:
          type: object
          description: 'Detalle, según el código: `faltantes` (MISSING_FIELDS), `invalidas` (INVALID_DATE_FORMAT) o `estado` (DOCUMENT_NOT_VOIDABLE).'
          example: { "faltantes": ["documentos[1].motivo_anulacion"] }

    ErrorNegocio:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Undefined array key \"fecha_de_emision_de_documentos\""

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |-
        Token de la cuenta (columna "Api Token" en Configuración → Usuarios,
        o campo `token` de la respuesta de `POST /api/login`).
        Enviar en cada petición: `Authorization: Bearer <TOKEN>`.
