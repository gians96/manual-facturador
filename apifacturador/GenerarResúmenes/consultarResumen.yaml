openapi: 3.0.3
info:
  title: Introducción
  description: |-
    La API del **Facturador** permite emitir comprobantes de pago electrónicos (CPE) y
    obtener por cada uno los 3 archivos indispensables: **XML Firmado, PDF y CDR**.

    Documentos contemplados:

    1. Factura
    2. Boleta
    3. Nota de Crédito
    4. Nota de Débito
    5. Resúmenes diarios (boletas)
    6. Anulaciones (comunicación de baja)
    7. Guía de remisión (remitente y transportista)
    8. Cotización
    9. Inventarios
    10. Productos

    **Autenticación:** todas las peticiones requieren el token de la cuenta enviado en el
    encabezado `Authorization: Bearer <TOKEN>` junto con `Accept: application/json`.
    El token se obtiene en el módulo **Configuración → Usuarios** del sistema (columna
    "Api Token") o mediante `POST /api/login` con el correo y contraseña del usuario.
  version: "8.0.0"
servers:
  - url: https://tu-dominio.com
    description: "Producción: reemplazar por el dominio de tu empresa"
  - url: https://tu-dominio.com
    description: Demostración
tags:
  - name: api
    description: Emisión de comprobantes electrónicos (CPE)

paths:
  /api/summaries/status:
    post:
      tags:
        - api
      summary: CONSULTAR RESUMEN
      description: |
        Consulta ante SUNAT el ticket de un **resumen diario** registrado con
        `POST /api/summaries` (`codigo_tipo_proceso: "1"`). Es el paso que deja las boletas
        **aceptadas**: al registrar el resumen quedan en `03` Enviado, y solo pasan a `05`
        Aceptado cuando esta consulta devuelve `response.code: "0"`.

        Se identifica el resumen por su `external_id` **o** por su `ticket`: basta uno de los
        dos. Son los **del resumen**, los que devolvió `POST /api/summaries`; con el
        `external_id` de una boleta responde que no encontró resumen relacionado.

        **El CDR es el del resumen.** `links.cdr` descarga un ZIP
        (`R-{RUC}-RC-{fecha}-{n}.zip`) que vale para todas las boletas del resumen. Una boleta
        declarada por resumen no tiene CDR propio: `/downloads/document/cdr/{external_id}` de la
        boleta responde 500.

        **Las boletas del resumen vienen en `data.documents`** (desde el 2026-09-22), con el
        estado en que quedaron **después** de la consulta: con esta respuesta se actualiza la
        base del integrador sin consultar boleta a boleta. Solo cambian esas boletas: una
        registrada después de enviar el resumen, aunque sea de la misma fecha, sigue en `01` y
        va en el siguiente.

        **Qué puede volver:**
        - `response.code: "0"` → aceptado; las boletas pasan a `05` (`11` en una anulación).
        - HTTP 500 `Code: 98; Description: El procesamiento del comprobante aún no ha terminado`
          → SUNAT aún procesa (empresa que envía directo a SUNAT). **Se reintenta** en unos
          minutos.
        - HTTP 200 sin `response.code` → lo mismo en una empresa que envía por un PSE. Se
          consulta más tarde.
        - `response.code` distinto de `"0"` → SUNAT rechazó el resumen. Si la empresa envía
          directo a SUNAT (`status_code: 99`), el resumen queda en `09` y sus boletas vuelven a
          `01`, listas para otro resumen de la misma fecha. Por un PSE no cambia ningún estado:
          el resumen y sus boletas siguen en `03`.

        **No se vuelve a consultar un resumen ya aceptado:** cada consulta aceptada pone otra
        vez en `05` todas sus boletas, también una que se haya anulado después.

        El ciclo completo, con la anulación y ejemplos reales:
        [Ciclo de la boleta](/devs/api/offline/endpoints/ciclo-de-la-boleta).

        ***Ejemplo:***
         - **Método:** POST
         - **URL:** `https://tu-dominio.com/api/summaries/status`
         - **Encabezados:** `Authorization: Bearer <TU_TOKEN>`, `Accept: application/json` y `Content-Type: application/json`
      operationId: consultarResumen
      requestBody:
        description: JSON a enviar (enviar `external_id` o `ticket` del resumen, al menos uno)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultaResumenRequest'
        required: true
      responses:
        '200':
          description: Estado del resumen. Aceptado solo si `response.code` es `"0"`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaConsultaResumen'
        '401':
          description: Token inválido o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNoAutenticado'
        '403':
          description: Tenant suspendido por licencia (`LICENSE_TENANT_BLOCKED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorLicencia'
        '500':
          description: |
            Solo el primero se reintenta:
            - `Code: 98; Description: El procesamiento del comprobante aún no ha terminado`
              (SUNAT aún procesa: consultar otra vez en unos minutos)
            - `Es requerido el código externo o ticket` (no se envió ninguno de los dos)
            - `El código externo {external_id} es inválido, no se encontró resumen relacionado`
              (casi siempre: se envió el `external_id` de la boleta en vez del del resumen)
            - `El ticket {ticket} es inválido, no se encontró resumen relacionado`
            - `Code: 0127; Description: El ticket no existe` (SUNAT ya no reconoce el ticket; en
              beta pasó al reconsultar un resumen que ya había respondido)
            - `Undefined variable $cdrResponse` (OSE SendFact mientras aún no hay CDR: tratarlo
              como el 98)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
      security:
        - bearerAuth: []

components:
  schemas:
    ConsultaResumenRequest:
      type: object
      description: Enviar `external_id` o `ticket` del resumen (al menos uno de los dos).
      properties:
        external_id:
          type: string
          description: Identificador **del resumen** (`data.external_id` de `POST /api/summaries`). Alternativa a `ticket`.
          example: "b88390b6-1755-413e-acf4-c6f905ce8181"
        ticket:
          type: string
          description: Ticket SUNAT devuelto al registrar el resumen (`data.ticket`). Alternativa a `external_id`.
          example: "1790027776413"

    RespuestaConsultaResumen:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            external_id:
              type: string
              example: "b88390b6-1755-413e-acf4-c6f905ce8181"
            ticket:
              type: string
              nullable: true
              description: Ticket SUNAT del resumen. Desde el 2026-09-22.
              example: "1790027776413"
            filename:
              type: string
              description: Nombre del archivo del resumen (RUC-RC-fecha de envío-correlativo).
              example: "20123456789-RC-20260921-1"
            date_of_reference:
              type: string
              format: date
              description: Fecha de emisión de las boletas. Desde el 2026-09-22.
              example: "2026-09-21"
            summary_status_type_id:
              type: string
              description: '"1" declaración, "3" anulación. Desde el 2026-09-22.'
              example: "1"
            state_type_id:
              type: string
              description: 'Estado del resumen tras la consulta: "05" aceptado, "09" rechazado (envío directo a SUNAT), "03" si aún no hay respuesta. Desde el 2026-09-22.'
              example: "05"
            state_type_description:
              type: string
              example: "Aceptado"
            documents:
              type: array
              description: |-
                Las boletas y notas de boleta de este resumen, con el estado en que quedaron
                después de la consulta: `05` (u `11` en una anulación) si SUNAT aceptó, `01` si
                rechazó un resumen enviado directo a SUNAT. Desde el 2026-09-22.
              items:
                $ref: '#/components/schemas/ComprobanteDelResumen'
        links:
          type: object
          properties:
            xml:
              type: string
              description: URL de descarga del XML firmado del resumen.
              example: "https://tu-dominio.com/downloads/summary/xml/b88390b6-1755-413e-acf4-c6f905ce8181"
            cdr:
              type: string
              description: URL de descarga del CDR **del resumen**, que es el de todas sus boletas. No pide token.
              example: "https://tu-dominio.com/downloads/summary/cdr/b88390b6-1755-413e-acf4-c6f905ce8181"
        response:
          type: object
          description: Respuesta de SUNAT.
          properties:
            sent:
              type: boolean
              example: true
            code:
              type: string
              description: '"0" indica aceptación. No llega mientras un PSE aún no devuelve el CDR.'
              example: "0"
            description:
              type: string
              example: "El Resumen diario RC-20260921-1, ha sido aceptado"
            notes:
              type: array
              items:
                type: string
              example: []
            is_accepted:
              type: boolean
              example: true
            status_code:
              type: integer
              description: Si la empresa envía directo a SUNAT, 0 aceptado y 99 rechazado. Por un PSE repite el código del CDR (igual que `code`), e `is_accepted` llega siempre `true`; decide solo con `code`.
              example: 0
      required:
        - success
        - data

    ComprobanteDelResumen:
      type: object
      properties:
        id:
          type: integer
          description: Id del comprobante, el mismo de la fila de `sync-batch`.
          example: 123
        external_id:
          type: string
          description: El `external_id` de la boleta.
          example: "c50fb61c-ed0c-4bc6-b70a-df7893a7eba8"
        offline_id:
          type: string
          nullable: true
          description: El que el integrador mandó a `sync-batch`, tal cual. `null` si la boleta no entró por `sync-batch`.
          example: "B2C3D4E5-F6A7-8901-BCDE-F12345678901"
        document_type_id:
          type: string
          description: '"03" boleta; "07" y "08", notas de crédito y débito de boleta.'
          example: "03"
        series:
          type: string
          example: "B001"
        number:
          type: integer
          description: El correlativo, sin la serie.
          example: 1
        number_full:
          type: string
          description: Serie y correlativo; lo que la fila de `sync-batch` llama `number`.
          example: "B001-1"
        currency_type_id:
          type: string
          example: "PEN"
        total:
          type: string
          description: Total declarado, como texto con dos decimales.
          example: "118.00"
        state_type_id:
          type: string
          description: Estado de la boleta después de la consulta.
          example: "05"
        state_type_description:
          type: string
          example: "Aceptado"

    ErrorNoAutenticado:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "No se encuentra autenticado"

    ErrorLicencia:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Operación bloqueada: tenant suspendido por licencia."
        message_code:
          type: string
          example: "LICENSE_TENANT_BLOCKED"

    ErrorNegocio:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Code: 98; Description: El procesamiento del comprobante aún no ha terminado"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |-
        Token de la cuenta (columna "Api Token" en Configuración → Usuarios,
        o campo `token` de la respuesta de `POST /api/login`).
        Enviar en cada petición: `Authorization: Bearer <TOKEN>`.
