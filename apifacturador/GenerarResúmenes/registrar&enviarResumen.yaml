openapi: 3.0.3
info:
  title: Introducción
  description: |-
    La API del **Facturador** permite emitir comprobantes de pago electrónicos (CPE) y
    obtener por cada uno los 3 archivos indispensables: **XML Firmado, PDF y CDR**.

    Documentos contemplados:

    1. Factura
    2. Boleta
    3. Nota de Crédito
    4. Nota de Débito
    5. Resúmenes diarios (boletas)
    6. Anulaciones (comunicación de baja)
    7. Guía de remisión (remitente y transportista)
    8. Cotización
    9. Inventarios
    10. Productos

    **Autenticación:** todas las peticiones requieren el token de la cuenta enviado en el
    encabezado `Authorization: Bearer <TOKEN>` junto con `Accept: application/json`.
    El token se obtiene en el módulo **Configuración → Usuarios** del sistema (columna
    "Api Token") o mediante `POST /api/login` con el correo y contraseña del usuario.
  version: "8.0.0"
servers:
  - url: https://tu-dominio.com
    description: "Producción: reemplazar por el dominio de tu empresa"
  - url: https://tu-dominio.com
    description: Demostración
tags:
  - name: api
    description: Emisión de comprobantes electrónicos (CPE)

paths:
  /api/summaries:
    post:
      tags:
        - api
      summary: REGISTRAR Y ENVIAR RESÚMEN
      description: |
        Las **boletas** (y sus notas de crédito/débito) no se envían individualmente a SUNAT:
        se declaran mediante un **resumen diario**. Este servicio, con
        `codigo_tipo_proceso: "1"`, registra y envía el resumen de una fecha: el sistema incluye
        **automáticamente** todas las boletas y notas de boleta emitidas en
        `fecha_de_emision_de_documentos` que aún no hayan sido declaradas — **no** se envía
        ningún array `documentos`.

        **Flujo completo:**
        1. Emitir las boletas con `POST /api/documents` (`codigo_tipo_documento: "03"`) o por
           `POST /api/offline/sync-batch`. Si la empresa no tiene activo el envío individual de
           boletas, quedan en `01` **Registrado**.
        2. Registrar el resumen de su fecha con este servicio → SUNAT devuelve un **ticket**
           (`data.ticket`). Las boletas que entran pasan a `03` **Enviado**.
        3. Consultar el resumen con `POST /api/summaries/status` (ver CONSULTAR RESUMEN) hasta
           obtener la aceptación; recién entonces las boletas quedan en `05` **Aceptado**. El CDR
           que se obtiene es **el del resumen**: la boleta no tiene CDR propio.

        El ciclo completo, con la anulación y ejemplos reales:
        [Ciclo de la boleta](/devs/api/offline/endpoints/ciclo-de-la-boleta).

        **Notas importantes:**
        - La fecha es la de **emisión de las boletas**, no la de hoy, en formato **`Y-m-d`**
          (año-mes-día), por ejemplo `"2026-07-22"`.
        - `codigo_tipo_proceso` se envía como texto: `"1"`.
        - `data.external_id` es **el del resumen**, no el de una boleta: es el que se usa para
          consultarlo. La respuesta no lista las boletas incluidas: son las que estaban en `01`
          con esa fecha, en el entorno actual de la empresa (demo o producción) y sin la marca de
          envío individual. Una boleta de envío individual que se quedó en `01` no entra en
          ningún resumen.
        - Entran hasta 500 documentos por resumen. Si quedan más, o se emiten más boletas con
          esa fecha, se vuelve a llamar con la misma fecha: el resumen nuevo solo lleva las que
          sigan en `01`.
        - Si no hay boletas pendientes de declarar en esa fecha, el servicio responde con error
          de negocio (ver respuesta 500). No se reintenta.
        - Las tareas programadas del panel pueden enviar y consultar este resumen cada
          madrugada, si la empresa las tiene activas.
        - Este mismo endpoint con `codigo_tipo_proceso: "3"` se usa para **anular** boletas
          (ver ANULACIÓN DE BOLETAS).

        ***Ejemplo:***
         - **Método:** POST
         - **URL:** `https://tu-dominio.com/api/summaries`
         - **Encabezados:** `Authorization: Bearer <TU_TOKEN>`, `Accept: application/json` y `Content-Type: application/json`
      operationId: registrar&enviarResumen
      requestBody:
        description: JSON a enviar
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumenRequest'
        required: true
      responses:
        '200':
          description: Resumen diario registrado y enviado; SUNAT devolvió un ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaResumen'
        '401':
          description: Token inválido o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNoAutenticado'
        '403':
          description: Tenant suspendido por licencia (`LICENSE_TENANT_BLOCKED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorLicencia'
        '400':
          description: |
            No se pudo leer el cuerpo; corrígelo antes de reintentar: `MISSING_CONTENT_TYPE`
            (falta `Content-Type: application/json`), `EMPTY_BODY` o `INVALID_JSON`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '422':
          description: |
            Desde el 2026-09-21: `MISSING_FIELDS` si falta `fecha_de_emision_de_documentos` o
            `codigo_tipo_proceso`, e `INVALID_PROCESS_TYPE` si el tipo no es del catálogo. En un
            servidor anterior, los dos primeros eran un 500 `Undefined array key "…"`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '500':
          description: |
            - `No se encontraron documentos con fecha de emisión {fecha}.` Nada que declarar en
              esa fecha: ya se declaró todo, la fecha no es la de emisión, las boletas en `01`
              son de envío individual o se emitieron en demo. No se reintenta.
            - `Code: …; Description: …` o `PSE. SEND - Code: …`: SUNAT o el PSE no recibieron el
              resumen. No se guarda nada y las boletas siguen en `01`: se reintenta con la
              misma fecha.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
      security:
        - bearerAuth: []

components:
  schemas:
    ResumenRequest:
      type: object
      properties:
        fecha_de_emision_de_documentos:
          type: string
          format: date
          description: |-
            Fecha de emisión de las boletas a declarar, en formato **Y-m-d** (año-mes-día).
            El sistema incluye automáticamente todas las boletas y notas de boleta de esa fecha
            que aún no hayan sido declaradas.
          example: "2026-07-22"
        codigo_tipo_proceso:
          type: string
          description: '"1" = resumen diario de boletas y sus notas, como texto. (Con "3" se anulan boletas, ver ANULACIÓN DE BOLETAS.)'
          example: "1"
      required:
        - fecha_de_emision_de_documentos
        - codigo_tipo_proceso

    RespuestaResumen:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            external_id:
              type: string
              description: Identificador único **del resumen** (no de una boleta). Guardarlo para consultarlo con `POST /api/summaries/status`.
              example: "8cf16a43-9134-4809-8677-f0ecafede0b2"
            ticket:
              type: string
              description: Ticket asignado por SUNAT. Consultarlo después con `POST /api/summaries/status`.
              example: "1784778434733"
      required:
        - success
        - data

    ErrorNoAutenticado:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "No se encuentra autenticado"

    ErrorLicencia:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Operación bloqueada: tenant suspendido por licencia."
        message_code:
          type: string
          example: "LICENSE_TENANT_BLOCKED"

    ErrorNegocio:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "No se encontraron documentos con fecha de emisión 2026-07-22."

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |-
        Token de la cuenta (columna "Api Token" en Configuración → Usuarios,
        o campo `token` de la respuesta de `POST /api/login`).
        Enviar en cada petición: `Authorization: Bearer <TOKEN>`.
