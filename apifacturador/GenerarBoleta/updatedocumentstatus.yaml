openapi: 3.0.3
info:
  title: Introducción
  description: |-
    La API del **Facturador** permite emitir comprobantes de pago electrónicos (CPE) y
    obtener por cada uno los 3 archivos indispensables: **XML Firmado, PDF y CDR**.

    Documentos contemplados:

    1. Factura
    2. Boleta
    3. Nota de Crédito
    4. Nota de Débito
    5. Resúmenes diarios (boletas)
    6. Anulaciones (comunicación de baja)
    7. Guía de remisión (remitente y transportista)
    8. Cotización
    9. Inventarios
    10. Productos

    **Autenticación:** todas las peticiones requieren el token de la cuenta enviado en el
    encabezado `Authorization: Bearer <TOKEN>` junto con `Accept: application/json`.
    El token se obtiene en el módulo **Configuración → Usuarios** del sistema (columna
    "Api Token") o mediante `POST /api/login` con el correo y contraseña del usuario.
  version: "8.0.0"
servers:
  - url: https://tu-dominio.com
    description: "Producción: reemplazar por el dominio de tu empresa"
  - url: https://tu-dominio.com
    description: Demostración
tags:
  - name: api
    description: Emisión de comprobantes electrónicos (CPE)

paths:
  /api/documents/updatedocumentstatus:
    post:
      tags:
        - api
      summary: ACTUALIZAR ESTADO DEL DOCUMENTO
      description: |
        Actualiza manualmente el estado interno (`state_type_id`) de un comprobante ya
        emitido, identificado por su `external_id`. Útil para sincronizar el estado en el
        sistema cuando la consulta o gestión ante SUNAT se hizo por otro medio.

        **Nota sobre el nombre del parámetro:** el campo se llama **`externail_id`**
        (con "ai") — es un typo histórico del backend que se mantiene por compatibilidad.
        Enviar el mismo valor de `external_id` devuelto al emitir el comprobante.

        **Estados válidos (`state_type_id`):**

        - `01` Registrado
        - `03` Enviado
        - `05` Aceptado
        - `07` Observado
        - `09` Rechazado
        - `11` Anulado
        - `13` Por anular

        ***Ejemplo:***
         - **Método:** POST
         - **URL:** `https://tu-dominio.com/api/documents/updatedocumentstatus`
         - **Encabezados:** `Authorization: Bearer <TU_TOKEN>`, `Accept: application/json` y `Content-Type: application/json`
      operationId: updatedocumentstatus
      requestBody:
        description: JSON a enviar
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarEstadoRequest'
        required: true
      responses:
        '200':
          description: Estado actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaActualizacion'
        '401':
          description: Token inválido o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNoAutenticado'
        '403':
          description: Bloqueo por licencia (tenant suspendido o emisión bloqueada)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorLicencia'
        '422':
          description: Error de validación de campos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
        '500':
          description: Error de negocio (documento no encontrado, estado inválido, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
      security:
        - bearerAuth: []

components:
  schemas:
    ActualizarEstadoRequest:
      type: object
      properties:
        externail_id:
          type: string
          description: |-
            Identificador único del comprobante (el `external_id` devuelto al emitir).
            OJO: el nombre del campo es "externail_id" (typo histórico del backend,
            se mantiene por compatibilidad).
          example: "46c6ce9d-aaae-4b8d-8e94-a6f94c964b47"
        state_type_id:
          type: string
          description: '"01" Registrado, "03" Enviado, "05" Aceptado, "07" Observado, "09" Rechazado, "11" Anulado, "13" Por anular.'
          example: "05"
      required:
        - externail_id
        - state_type_id

    RespuestaActualizacion:
      type: object
      properties:
        success:
          type: boolean
          example: true
      required:
        - success

    ErrorNoAutenticado:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "No se encuentra autenticado"

    ErrorLicencia:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Emisión bloqueada por licencia."
        message_code:
          type: string
          description: '"LICENSE_TENANT_BLOCKED" (tenant suspendido) o "LICENSE_EMISSION_BLOCKED" (emisión bloqueada).'
          example: "LICENSE_EMISSION_BLOCKED"

    ErrorValidacion:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: object
          description: Objeto con los errores por campo.
          example:
            state_type_id: ["El campo state type id es obligatorio."]

    ErrorNegocio:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "No se encontró el documento indicado."

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |-
        Token de la cuenta (columna "Api Token" en Configuración → Usuarios,
        o campo `token` de la respuesta de `POST /api/login`).
        Enviar en cada petición: `Authorization: Bearer <TOKEN>`.
