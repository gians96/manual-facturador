openapi: 3.0.3
info:
  title: Introducción
  description: |-
    La API del **Facturador** permite emitir comprobantes de pago electrónicos (CPE) y
    obtener por cada uno los 3 archivos indispensables: **XML Firmado, PDF y CDR**.

    Documentos contemplados:

    1. Factura
    2. Boleta
    3. Nota de Crédito
    4. Nota de Débito
    5. Resúmenes diarios (boletas)
    6. Anulaciones (comunicación de baja)
    7. Guía de remisión (remitente y transportista)
    8. Cotización
    9. Inventarios
    10. Productos

    **Autenticación:** todas las peticiones requieren el token de la cuenta enviado en el
    encabezado `Authorization: Bearer <TOKEN>` junto con `Accept: application/json`.
    El token se obtiene en el módulo **Configuración → Usuarios** del sistema (columna
    "Api Token") o mediante `POST /api/login` con el correo y contraseña del usuario.
  version: "8.0.0"
servers:
  - url: https://tu-dominio.com
    description: "Producción: reemplazar por el dominio de tu empresa"
  - url: https://tu-dominio.com
    description: Demostración
tags:
  - name: api
    description: Emisión de comprobantes electrónicos (CPE)

paths:
  /api/documents:
    post:
      tags:
        - api
      summary: NOTA DE CRÉDITO SIN EXTERNAL ID - FACTURA
      description: |
        Variante de la Nota de Crédito para cuando **no se conoce el `external_id`** del
        comprobante afectado (por ejemplo, si la factura se emitió desde otro sistema o no se
        guardó la respuesta de emisión). En ese caso `documento_afectado` se identifica con
        `serie_documento`, `numero_documento` y `codigo_tipo_documento`.

        ***Ejemplo:***
         - **Método:** POST
         - **URL:** `https://tu-dominio.com/api/documents`
         - **Encabezados:** `Authorization: Bearer <TU_TOKEN>`, `Accept: application/json` y `Content-Type: application/json`

        **Notas importantes:**
        - `numero_documento: "#"` deja que el sistema asigne el correlativo automáticamente (recomendado).
        - La serie de la nota debe existir en el sistema para el tipo `07` y empezar con la letra
          del comprobante afectado: `FC01` para notas de crédito de **facturas**, `BC01` para
          notas de crédito de **boletas**.
        - El comprobante afectado debe existir en el sistema con la serie, número y tipo indicados.
        - Las notas de **factura** se envían a SUNAT al emitirse (la respuesta incluye
          `response.code "0"` y `links.cdr`). Las notas de **boleta** se declaran mediante el
          resumen diario.
      operationId: notaCreditoSinExternalId
      requestBody:
        description: JSON a enviar
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotaCreditoRequest'
        required: true
      responses:
        '200':
          description: Nota de crédito emitida correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaEmision'
        '401':
          description: Token inválido o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNoAutenticado'
        '403':
          description: Bloqueo por licencia (tenant suspendido o emisión bloqueada)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorLicencia'
        '400':
          description: >-
            El cuerpo de la petición no se pudo interpretar. El campo `error_code`
            distingue el motivo: `MISSING_CONTENT_TYPE` (falta la cabecera
            `Content-Type: application/json`, la causa más frecuente),
            `INVALID_JSON` (sintaxis rota), `EMPTY_BODY` (cuerpo vacío o
            truncado) o `BODY_IS_LIST` (se envió un arreglo en vez del objeto).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
        '422':
          description: >-
            Error de validación. `error_code`: `MISSING_FIELDS` (faltan campos
            obligatorios; se listan todos de una vez, con el número de ítem, pago
            o cuota), `INVALID_UNIT_TYPE` (unidad de medida fuera del catálogo 03
            de SUNAT, con la sugerencia del código correcto) o `TOTALS_MISMATCH`
            (el total declarado no cuadra con la suma de los ítems). Aquí salen
            también las reglas de negocio —serie incorrecta, ubigeo, fecha fuera
            de plazo—, que **antes devolvían 500**.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
        '500':
          description: >-
            Fallo real del servidor. Un dato mal enviado ya no devuelve 500:
            revisa los códigos 400 y 422.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
      security:
        - bearerAuth: []

components:
  schemas:
    NotaCreditoRequest:
      type: object
      properties:
        serie_documento:
          type: string
          description: Serie de la nota. Debe existir en el sistema para el tipo "07" y empezar con la letra del comprobante afectado ("FC01" para facturas, "BC01" para boletas).
          example: "FC01"
        numero_documento:
          type: string
          description: Correlativo. Usar "#" para que el sistema lo asigne automáticamente (recomendado).
          example: "#"
        fecha_de_emision:
          type: string
          format: date
          example: "2026-07-22"
        hora_de_emision:
          type: string
          example: "10:11:11"
        codigo_tipo_documento:
          type: string
          description: '"07" Nota de Crédito.'
          example: "07"
        codigo_tipo_nota:
          type: string
          description: |-
            Catálogo 09 SUNAT (tipos de nota de crédito):
            "01" anulación de la operación, "02" anulación por error en el RUC,
            "03" corrección por error en la descripción, "04" descuento global,
            "05" descuento por item, "06" devolución total, "07" devolución por item,
            "08" bonificación, "09" disminución en el valor, "10" otros conceptos.
          example: "01"
        motivo_o_sustento_de_nota:
          type: string
          description: Descripción del motivo de la nota.
          example: "Anulación de la operación"
        codigo_tipo_moneda:
          type: string
          description: '"PEN" o "USD".'
          example: "PEN"
        numero_orden_de_compra:
          type: string
          description: Opcional.
          example: "0045467898"
        documento_afectado:
          type: object
          description: Comprobante que la nota modifica, identificado por serie, número y tipo (sin `external_id`). Debe existir en el sistema.
          required:
            - serie_documento
            - numero_documento
            - codigo_tipo_documento
          properties:
            serie_documento:
              type: string
              description: Serie del comprobante afectado.
              example: "F001"
            numero_documento:
              type: string
              description: Correlativo del comprobante afectado.
              example: "190"
            codigo_tipo_documento:
              type: string
              description: 'Tipo del comprobante afectado: "01" Factura, "03" Boleta.'
              example: "01"
        datos_del_cliente_o_receptor:
          type: object
          description: Debe corresponder al cliente del comprobante afectado.
          required:
            - codigo_tipo_documento_identidad
            - numero_documento
            - apellidos_y_nombres_o_razon_social
          properties:
            codigo_tipo_documento_identidad:
              type: string
              description: Catálogo 06 SUNAT. "6" RUC (facturas), "1" DNI.
              example: "6"
            numero_documento:
              type: string
              example: "20123456789"
            apellidos_y_nombres_o_razon_social:
              type: string
              example: "EMPRESA XYZ S.A."
            codigo_pais:
              type: string
              example: "PE"
            ubigeo:
              type: string
              description: Obligatorio (6 dígitos) cuando el cliente es RUC.
              example: "150101"
            direccion:
              type: string
              example: "Av. 2 de Mayo 123 - Lima"
            correo_electronico:
              type: string
              example: "cliente@correo.com"
            telefono:
              type: string
              example: "999888777"
        totales:
          type: object
          required:
            - total_venta
          properties:
            total_exportacion:
              type: number
              example: 0
            total_operaciones_gravadas:
              type: number
              example: 100
            total_operaciones_inafectas:
              type: number
              example: 0
            total_operaciones_exoneradas:
              type: number
              example: 0
            total_operaciones_gratuitas:
              type: number
              example: 0
            total_igv:
              type: number
              example: 18
            total_impuestos:
              type: number
              example: 18
            total_valor:
              type: number
              example: 100
            total_venta:
              type: number
              description: Importe total de la nota.
              example: 118
        items:
          type: array
          items:
            type: object
            required:
              - descripcion
              - unidad_de_medida
              - cantidad
            properties:
              codigo_interno:
                type: string
                example: "P0121"
              descripcion:
                type: string
                example: "Inca Kola 250 ml"
              codigo_producto_sunat:
                type: string
                example: "51121703"
              unidad_de_medida:
                type: string
                description: Catálogo de unidades SUNAT ("NIU" unidad, "ZZ" servicio, etc.).
                example: "NIU"
              cantidad:
                type: number
                example: 2
              valor_unitario:
                type: number
                description: Precio sin IGV.
                example: 50
              codigo_tipo_precio:
                type: string
                example: "01"
              precio_unitario:
                type: number
                description: Precio con IGV.
                example: 59
              codigo_tipo_afectacion_igv:
                type: string
                description: Catálogo 07 SUNAT. "10" gravado, "20" exonerado, "30" inafecto.
                example: "10"
              total_base_igv:
                type: number
                example: 100
              porcentaje_igv:
                type: number
                example: 18
              total_igv:
                type: number
                example: 18
              total_impuestos:
                type: number
                example: 18
              total_valor_item:
                type: number
                example: 100
              total_item:
                type: number
                example: 118
        acciones:
          type: object
          description: Acciones posteriores a la emisión.
          properties:
            formato_pdf:
              type: string
              description: '"a4", "ticket" o "ticket_58".'
              example: "a4"
      required:
        - serie_documento
        - numero_documento
        - fecha_de_emision
        - hora_de_emision
        - codigo_tipo_documento
        - codigo_tipo_moneda
        - codigo_tipo_nota
        - motivo_o_sustento_de_nota
        - documento_afectado
        - datos_del_cliente_o_receptor
        - totales
        - items

    RespuestaEmision:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            number:
              type: string
              example: "FC01-9"
            filename:
              type: string
              example: "20123456789-07-FC01-9"
            external_id:
              type: string
              description: Identificador único de la nota emitida. Se usa en descargas y consultas.
              example: "a1dd8443-8c03-48f4-98f3-fb69fb5fe565"
            state_type_id:
              type: string
              description: '"01" Registrado (sin enviar), "03" Enviado, "05" Aceptado, "07" Observado, "09" Rechazado, "11" Anulado, "13" Por anular.'
              example: "05"
            state_type_description:
              type: string
              example: "Aceptado"
            number_to_letter:
              type: string
              example: "Ciento dieciocho con 00/100"
            hash:
              type: string
              example: "Qiyl7YgN/7ZxigWWQL+uf8198KI="
            qr:
              type: string
              description: Imagen QR del comprobante en base64 (PNG).
              example: "iVBORw0KGgoAAAANSUhEUgAA..."
            id:
              type: integer
              example: 562
            print_ticket:
              type: string
              description: URL de impresión en formato ticket.
              example: "https://tu-dominio.com/print/document/a1dd8443-.../ticket"
        print:
          type: object
          description: Resultado de la impresión automática server-side (`acciones.auto_print`).
          properties:
            auto_printed:
              type: boolean
              description: Si es `true`, el servidor ya imprimió — el cliente no debe reimprimir.
              example: false
            print_order_id:
              type: integer
              nullable: true
              example: null
            reason:
              type: string
              nullable: true
              example: "disabled"
        data_ws:
          type: object
          description: Datos listos para compartir el comprobante (WhatsApp/mensajería).
          properties:
            message_text:
              type: string
              example: "Su comprobante de pago electrónico FC01-9 ha sido generado correctamente..."
            pdf_a4_filename:
              type: string
              example: "https://tu-dominio.com/api/document-file/document/a1dd8443-.../a4"
            pdf_ticket_filename:
              type: string
              example: "https://tu-dominio.com/api/document-file/document/a1dd8443-.../ticket"
            full_filename:
              type: string
              example: "20123456789-07-FC01-9.pdf"
            customer_telephone:
              type: string
              example: "999888777"
        links:
          type: object
          properties:
            xml:
              type: string
              example: "https://tu-dominio.com/downloads/document/xml/a1dd8443-8c03-48f4-98f3-fb69fb5fe565"
            pdf:
              type: string
              example: "https://tu-dominio.com/downloads/document/pdf/a1dd8443-8c03-48f4-98f3-fb69fb5fe565"
            cdr:
              type: string
              description: Las notas de factura se envían a SUNAT al emitirse, por lo que el CDR está disponible de inmediato.
              example: "https://tu-dominio.com/downloads/document/cdr/a1dd8443-8c03-48f4-98f3-fb69fb5fe565"
        response:
          type: object
          description: Respuesta de SUNAT.
          properties:
            code:
              type: string
              example: "0"
            description:
              type: string
              example: "La Nota de Credito numero FC01-9, ha sido aceptada"
            notes:
              type: array
              items:
                type: string
        was_duplicate:
          type: boolean
          description: '`true` cuando la emisión se deduplicó por `offline_id` (se devolvió un documento ya existente).'
          example: false
      required:
        - success
        - data

    ErrorNoAutenticado:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "No se encuentra autenticado"

    ErrorLicencia:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Emisión bloqueada por licencia."
        message_code:
          type: string
          description: '"LICENSE_TENANT_BLOCKED" (tenant suspendido) o "LICENSE_EMISSION_BLOCKED" (emisión bloqueada).'
          example: "LICENSE_EMISSION_BLOCKED"

    ErrorValidacion:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: object
          description: Objeto con los errores por campo.
          example:
            codigo_tipo_nota: ["El campo codigo tipo nota es obligatorio."]

    ErrorNegocio:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "El documento afectado F001-190 no se encuentra registrado."

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |-
        Token de la cuenta (columna "Api Token" en Configuración → Usuarios,
        o campo `token` de la respuesta de `POST /api/login`).
        Enviar en cada petición: `Authorization: Bearer <TOKEN>`.
