openapi: 3.0.3
info:
  title: Introducción
  description: |-
    La API del **Facturador** permite emitir comprobantes de pago electrónicos (CPE) y
    obtener por cada uno los 3 archivos indispensables: **XML Firmado, PDF y CDR**.

    Documentos contemplados:

    1. Factura
    2. Boleta
    3. Nota de Crédito
    4. Nota de Débito
    5. Resúmenes diarios (boletas)
    6. Anulaciones (comunicación de baja)
    7. Guía de remisión (remitente y transportista)
    8. Cotización
    9. Inventarios
    10. Productos

    **Autenticación:** todas las peticiones requieren el token de la cuenta enviado en el
    encabezado `Authorization: Bearer <TOKEN>` junto con `Accept: application/json`.
    El token se obtiene en el módulo **Configuración → Usuarios** del sistema (columna
    "Api Token") o mediante `POST /api/login` con el correo y contraseña del usuario.
  version: "8.0.0"
servers:
  - url: https://tu-dominio.com
    description: "Producción: reemplazar por el dominio de tu empresa"
  - url: https://empresa.pro8.uio.la
    description: Demostración
tags:
  - name: api
    description: Emisión de comprobantes electrónicos (CPE)

paths:
  /api/documents/send:
    post:
      tags:
        - api
      summary: ENVIAR FACTURA REGISTRADA (SIN ENVIAR)
      description: |
        Envía a SUNAT una factura que quedó en estado **Registrado** (`state_type_id: "01"`),
        por ejemplo la emitida con `acciones.enviar_xml_firmado: false` (ver
        *FACTURA GRAVADA SIN ENVIAR*). Solo se necesita el `external_id` que devolvió la emisión.
        Al aceptarse, el documento pasa a estado **Aceptado** (`05`) y queda disponible el CDR.

        **Solo aplica a facturas y a notas de crédito/débito de factura.** Las boletas de venta
        (y sus notas) no se envían individualmente a SUNAT: se declaran mediante el
        **resumen diario**.

        ***Ejemplo:***
         - **Método:** POST
         - **URL:** `https://tu-dominio.com/api/documents/send`
         - **Encabezados:** `Authorization: Bearer <TU_TOKEN>` y `Accept: application/json`
      operationId: facturaGeneradaOffline
      requestBody:
        description: JSON a enviar
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnviarDocumentoRequest'
        required: true
      responses:
        '200':
          description: Documento enviado a SUNAT correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaEnvio'
        '401':
          description: Token inválido o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNoAutenticado'
        '403':
          description: Bloqueo por licencia (tenant suspendido o emisión bloqueada)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorLicencia'
        '422':
          description: Error de validación de campos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
        '500':
          description: Error de negocio (documento no encontrado, tipo de documento no permitido, error de SUNAT, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
      security:
        - bearerAuth: []

components:
  schemas:
    EnviarDocumentoRequest:
      type: object
      properties:
        external_id:
          type: string
          description: Identificador único del documento, devuelto en `data.external_id` al emitirlo.
          example: "eada8140-d0cb-4f4c-bd84-6fed5879493c"
      required:
        - external_id

    RespuestaEnvio:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            number:
              type: string
              example: "F001-8"
            filename:
              type: string
              example: "12312312312-01-F001-8"
            external_id:
              type: string
              example: "eada8140-d0cb-4f4c-bd84-6fed5879493c"
            state_type_id:
              type: string
              description: Estado resultante. "05" Aceptado si SUNAT aceptó el comprobante.
              example: "05"
            state_type_description:
              type: string
              example: "Aceptado"
        links:
          type: object
          properties:
            cdr:
              type: string
              description: Descarga del CDR obtenido de SUNAT.
              example: "https://tu-dominio.com/downloads/document/cdr/eada8140-d0cb-4f4c-bd84-6fed5879493c"
        response:
          type: object
          description: Respuesta de SUNAT.
          properties:
            code:
              type: string
              example: "0"
            description:
              type: string
              example: "La Factura numero F001-8, ha sido aceptada"
            notes:
              type: array
              items:
                type: string
              example: []
      required:
        - success
        - data

    ErrorNoAutenticado:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "No se encuentra autenticado"

    ErrorLicencia:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Emisión bloqueada por licencia."
        message_code:
          type: string
          description: '"LICENSE_TENANT_BLOCKED" (tenant suspendido) o "LICENSE_EMISSION_BLOCKED" (emisión bloqueada).'
          example: "LICENSE_EMISSION_BLOCKED"

    ErrorValidacion:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: object
          description: Objeto con los errores por campo.
          example:
            external_id: ["El campo external id es obligatorio."]

    ErrorNegocio:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "El documento no se encuentra registrado."

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |-
        Token de la cuenta (columna "Api Token" en Configuración → Usuarios,
        o campo `token` de la respuesta de `POST /api/login`).
        Enviar en cada petición: `Authorization: Bearer <TOKEN>`.
