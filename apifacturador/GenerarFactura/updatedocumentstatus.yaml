openapi: 3.0.3
info:
  title: Introducción
  description: |-
    La API del **Facturador PRO 8** permite emitir comprobantes de pago electrónicos (CPE) y
    obtener por cada uno los 3 archivos indispensables: **XML Firmado, PDF y CDR**.

    Documentos contemplados:

    1. Factura
    2. Boleta
    3. Nota de Crédito
    4. Nota de Débito
    5. Resúmenes diarios (boletas)
    6. Anulaciones (comunicación de baja)
    7. Guía de remisión (remitente y transportista)
    8. Cotización
    9. Inventarios
    10. Productos

    **Autenticación:** todas las peticiones requieren el token de la cuenta enviado en el
    encabezado `Authorization: Bearer <TOKEN>` junto con `Accept: application/json`.
    El token se obtiene en el módulo **Configuración → Usuarios** del sistema (columna
    "Api Token") o mediante `POST /api/login` con el correo y contraseña del usuario.
  version: "8.0.0"
servers:
  - url: https://tu-dominio.com
    description: "Producción: reemplazar por el dominio de tu empresa"
  - url: https://empresa.pro8.uio.la
    description: Demostración
tags:
  - name: api
    description: Emisión de comprobantes electrónicos (CPE)

paths:
  /api/documents/updatedocumentstatus:
    post:
      tags:
        - api
      summary: ACTUALIZAR ESTADO DEL DOCUMENTO
      description: |
        Actualiza manualmente el estado interno de un documento en el sistema. **No comunica nada
        a SUNAT**: sirve para sincronizar el estado cuando este se gestionó por otra vía (por
        ejemplo, consulta manual del CDR o regularización externa).

        :::warning El nombre del campo lleva un typo histórico

        El campo del cuerpo se llama **`externail_id`** (así, con "ail"). Corresponde al
        `external_id` del documento, pero el backend lee exactamente la clave `externail_id`;
        enviar `external_id` no funciona.

        :::

        **Estados posibles (`state_type_id`):**

        - `01` Registrado
        - `03` Enviado
        - `05` Aceptado
        - `07` Observado
        - `09` Rechazado
        - `11` Anulado
        - `13` Por anular

        ***Ejemplo:***
         - **Método:** POST
         - **URL:** `https://tu-dominio.com/api/documents/updatedocumentstatus`
         - **Encabezados:** `Authorization: Bearer <TU_TOKEN>` y `Accept: application/json`
      operationId: updatedocumentstatus
      requestBody:
        description: JSON a enviar
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarEstadoRequest'
        required: true
      responses:
        '200':
          description: Estado actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaActualizarEstado'
        '401':
          description: Token inválido o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNoAutenticado'
        '403':
          description: Bloqueo por licencia (tenant suspendido o emisión bloqueada)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorLicencia'
        '422':
          description: Error de validación de campos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
        '500':
          description: Error de negocio (documento no encontrado, estado inválido, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
      security:
        - bearerAuth: []

components:
  schemas:
    ActualizarEstadoRequest:
      type: object
      properties:
        externail_id:
          type: string
          description: |-
            `external_id` del documento (devuelto en `data.external_id` al emitirlo).
            OJO: la clave se escribe `externail_id`, con el typo histórico — el backend
            lee exactamente ese nombre.
          example: "46c6ce9d-aaae-4b8d-8e94-a6f94c964b47"
        state_type_id:
          type: string
          description: |-
            Nuevo estado del documento: "01" Registrado, "03" Enviado, "05" Aceptado,
            "07" Observado, "09" Rechazado, "11" Anulado, "13" Por anular.
          enum: ["01", "03", "05", "07", "09", "11", "13"]
          example: "05"
      required:
        - externail_id
        - state_type_id

    RespuestaActualizarEstado:
      type: object
      properties:
        success:
          type: boolean
          example: true
      required:
        - success

    ErrorNoAutenticado:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "No se encuentra autenticado"

    ErrorLicencia:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Emisión bloqueada por licencia."
        message_code:
          type: string
          description: '"LICENSE_TENANT_BLOCKED" (tenant suspendido) o "LICENSE_EMISSION_BLOCKED" (emisión bloqueada).'
          example: "LICENSE_EMISSION_BLOCKED"

    ErrorValidacion:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: object
          description: Objeto con los errores por campo.
          example:
            state_type_id: ["El campo state type id es obligatorio."]

    ErrorNegocio:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "El documento no se encuentra registrado."

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |-
        Token de la cuenta (columna "Api Token" en Configuración → Usuarios,
        o campo `token` de la respuesta de `POST /api/login`).
        Enviar en cada petición: `Authorization: Bearer <TOKEN>`.
