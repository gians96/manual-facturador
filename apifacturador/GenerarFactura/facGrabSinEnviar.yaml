openapi: 3.0.3
info:
  title: Introducción
  description: |-
    La API del **Facturador PRO 8** permite emitir comprobantes de pago electrónicos (CPE) y
    obtener por cada uno los 3 archivos indispensables: **XML Firmado, PDF y CDR**.

    Documentos contemplados:

    1. Factura
    2. Boleta
    3. Nota de Crédito
    4. Nota de Débito
    5. Resúmenes diarios (boletas)
    6. Anulaciones (comunicación de baja)
    7. Guía de remisión (remitente y transportista)
    8. Cotización
    9. Inventarios
    10. Productos

    **Autenticación:** todas las peticiones requieren el token de la cuenta enviado en el
    encabezado `Authorization: Bearer <TOKEN>` junto con `Accept: application/json`.
    El token se obtiene en el módulo **Configuración → Usuarios** del sistema (columna
    "Api Token") o mediante `POST /api/login` con el correo y contraseña del usuario.
  version: "8.0.0"
servers:
  - url: https://tu-dominio.com
    description: "Producción: reemplazar por el dominio de tu empresa"
  - url: https://empresa.pro8.uio.la
    description: Demostración
tags:
  - name: api
    description: Emisión de comprobantes electrónicos (CPE)

paths:
  /api/documents:
    post:
      tags:
        - api
      summary: FACTURA GRAVADA SIN ENVIAR
      description: |
        Genera la factura **sin enviarla a SUNAT**: se obtienen el XML firmado y el PDF normalmente,
        y el comprobante queda en estado **Registrado** (`state_type_id: "01"`). Es útil cuando no
        hay conexión estable o cuando se prefiere enviar en lote más tarde.

        Para ello se agrega al cuerpo:

        ```json
        "acciones": { "enviar_xml_firmado": false }
        ```

        En un momento posterior se envía a SUNAT con `POST /api/documents/send` (usando el
        `external_id` devuelto) y recién ahí se obtiene el CDR. Mientras tanto, `links.cdr`
        viene vacío ("") y `response` viene vacío.

        ***Ejemplo:***
         - **Método:** POST
         - **URL:** `https://tu-dominio.com/api/documents`
         - **Encabezados:** `Authorization: Bearer <TU_TOKEN>` y `Accept: application/json`
      operationId: facturaGravadaSinEnviar
      requestBody:
        description: JSON a enviar
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacturaRequest'
        required: true
      responses:
        '200':
          description: Comprobante registrado correctamente (sin enviar a SUNAT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaEmision'
        '401':
          description: Token inválido o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNoAutenticado'
        '403':
          description: Bloqueo por licencia (tenant suspendido o emisión bloqueada)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorLicencia'
        '422':
          description: Error de validación de campos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
        '500':
          description: Error de negocio (serie incorrecta, cliente inválido, fecha fuera de plazo, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocio'
      security:
        - bearerAuth: []

components:
  schemas:
    FacturaRequest:
      type: object
      properties:
        serie_documento:
          type: string
          example: "F001"
        numero_documento:
          type: string
          description: Usar "#" para que el sistema asigne el correlativo automáticamente (recomendado).
          example: "#"
        fecha_de_emision:
          type: string
          format: date
          example: "2026-07-22"
        hora_de_emision:
          type: string
          example: "10:11:11"
        codigo_tipo_operacion:
          type: string
          description: Catálogo 51 SUNAT. "0101" venta interna.
          example: "0101"
        codigo_tipo_documento:
          type: string
          description: '"01" Factura.'
          example: "01"
        codigo_tipo_moneda:
          type: string
          example: "PEN"
        fecha_de_vencimiento:
          type: string
          format: date
          description: Opcional.
          example: "2026-07-22"
        numero_orden_de_compra:
          type: string
          description: Opcional.
          example: "0045467898"
        datos_del_cliente_o_receptor:
          type: object
          required:
            - codigo_tipo_documento_identidad
            - numero_documento
            - apellidos_y_nombres_o_razon_social
          properties:
            codigo_tipo_documento_identidad:
              type: string
              description: '"6" RUC (obligatorio en facturas de venta interna).'
              example: "6"
            numero_documento:
              type: string
              example: "20123456789"
            apellidos_y_nombres_o_razon_social:
              type: string
              example: "EMPRESA XYZ S.A."
            codigo_pais:
              type: string
              example: "PE"
            ubigeo:
              type: string
              example: "150101"
            direccion:
              type: string
              example: "Av. 2 de Mayo 123 - Lima"
            correo_electronico:
              type: string
              example: "cliente@correo.com"
            telefono:
              type: string
              example: "999888777"
        totales:
          type: object
          required:
            - total_venta
          properties:
            total_exportacion:
              type: number
              example: 0
            total_operaciones_gravadas:
              type: number
              example: 100
            total_operaciones_inafectas:
              type: number
              example: 0
            total_operaciones_exoneradas:
              type: number
              example: 0
            total_operaciones_gratuitas:
              type: number
              example: 0
            total_igv:
              type: number
              example: 18
            total_impuestos:
              type: number
              example: 18
            total_valor:
              type: number
              example: 100
            total_venta:
              type: number
              example: 118
        items:
          type: array
          items:
            type: object
            required:
              - descripcion
              - unidad_de_medida
              - cantidad
            properties:
              codigo_interno:
                type: string
                example: "P0121"
              descripcion:
                type: string
                example: "Inca Kola 250 ml"
              codigo_producto_sunat:
                type: string
                example: "51121703"
              unidad_de_medida:
                type: string
                example: "NIU"
              cantidad:
                type: number
                example: 2
              valor_unitario:
                type: number
                description: Precio sin IGV.
                example: 50
              codigo_tipo_precio:
                type: string
                example: "01"
              precio_unitario:
                type: number
                description: Precio con IGV.
                example: 59
              codigo_tipo_afectacion_igv:
                type: string
                description: '"10" gravado - operación onerosa.'
                example: "10"
              total_base_igv:
                type: number
                example: 100
              porcentaje_igv:
                type: number
                example: 18
              total_igv:
                type: number
                example: 18
              total_impuestos:
                type: number
                example: 18
              total_valor_item:
                type: number
                example: 100
              total_item:
                type: number
                example: 118
        acciones:
          type: object
          description: 'Con `enviar_xml_firmado: false` el comprobante queda Registrado y NO se envía a SUNAT.'
          properties:
            enviar_xml_firmado:
              type: boolean
              example: false
      required:
        - serie_documento
        - numero_documento
        - fecha_de_emision
        - hora_de_emision
        - codigo_tipo_operacion
        - codigo_tipo_documento
        - codigo_tipo_moneda
        - datos_del_cliente_o_receptor
        - totales
        - items

    RespuestaEmision:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            number:
              type: string
              example: "F001-26"
            filename:
              type: string
              example: "20123456789-01-F001-26"
            external_id:
              type: string
              description: Identificador único del comprobante. Guardarlo — es el que se usa luego en `POST /api/documents/send`.
              example: "46c6ce9d-aaae-4b8d-8e94-a6f94c964b47"
            state_type_id:
              type: string
              description: '"01" Registrado — el comprobante aún no fue enviado a SUNAT.'
              example: "01"
            state_type_description:
              type: string
              example: "Registrado"
            number_to_letter:
              type: string
              example: "Ciento dieciocho con 00/100"
            hash:
              type: string
              example: "jFDgOlcAShjMeA1TJzT08v+PPTw="
            qr:
              type: string
              description: Imagen QR del comprobante en base64 (PNG).
              example: "iVBORw0KGgoAAAANSUhEUgAA..."
            id:
              type: integer
              example: 322
            print_ticket:
              type: string
              description: URL de impresión en formato ticket.
              example: "https://tu-dominio.com/print/document/46c6ce9d-.../ticket"
        print:
          type: object
          description: Resultado de la impresión automática server-side (`acciones.auto_print`).
          properties:
            auto_printed:
              type: boolean
              description: Si es `true`, el servidor ya imprimió — el cliente no debe reimprimir.
              example: false
            print_order_id:
              type: integer
              nullable: true
              example: null
            reason:
              type: string
              nullable: true
              example: "disabled"
        data_ws:
          type: object
          description: Datos listos para compartir el comprobante (WhatsApp/mensajería).
          properties:
            message_text:
              type: string
              example: "Su comprobante de pago electrónico F001-26 ha sido generado correctamente..."
            pdf_a4_filename:
              type: string
              example: "https://tu-dominio.com/api/document-file/document/46c6ce9d-.../a4"
            pdf_ticket_filename:
              type: string
              example: "https://tu-dominio.com/api/document-file/document/46c6ce9d-.../ticket"
            full_filename:
              type: string
              example: "20123456789-01-F001-26.pdf"
            customer_telephone:
              type: string
              example: "999888777"
        links:
          type: object
          properties:
            xml:
              type: string
              example: "https://tu-dominio.com/downloads/document/xml/46c6ce9d-aaae-4b8d-8e94-a6f94c964b47"
            pdf:
              type: string
              example: "https://tu-dominio.com/downloads/document/pdf/46c6ce9d-aaae-4b8d-8e94-a6f94c964b47"
            cdr:
              type: string
              description: Vacío ("") — el CDR se obtiene recién al enviar con `POST /api/documents/send`.
              example: ""
        response:
          type: array
          description: Vacío ([]) — no hay respuesta de SUNAT porque el comprobante aún no se envió.
          items:
            type: string
          example: []
        was_duplicate:
          type: boolean
          description: '`true` cuando la emisión se deduplicó por `offline_id` (se devolvió un documento ya existente).'
          example: false
      required:
        - success
        - data

    ErrorNoAutenticado:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "No se encuentra autenticado"

    ErrorLicencia:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Emisión bloqueada por licencia."
        message_code:
          type: string
          description: '"LICENSE_TENANT_BLOCKED" (tenant suspendido) o "LICENSE_EMISSION_BLOCKED" (emisión bloqueada).'
          example: "LICENSE_EMISSION_BLOCKED"

    ErrorValidacion:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: object
          description: Objeto con los errores por campo.
          example:
            serie_documento: ["El campo serie documento es obligatorio."]

    ErrorNegocio:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "La serie ingresada F001, es incorrecta."

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |-
        Token de la cuenta (columna "Api Token" en Configuración → Usuarios,
        o campo `token` de la respuesta de `POST /api/login`).
        Enviar en cada petición: `Authorization: Bearer <TOKEN>`.
